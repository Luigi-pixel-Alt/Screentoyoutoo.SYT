<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screentoyoutoo.SYT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  /* ===== FONTE (estilo Deltarune) =====
     Coloque o arquivo da fonte na mesma pasta do index.html com o nome fonte.ttf.
     Se o arquivo não existir, o site usa as fontes pixel do Google Fonts no lugar. */
  @font-face { font-family: 'Deltarune'; src: url('fonte.ttf') format('truetype'); font-display: swap; }

  /* ===== TEMAS ===== */
  :root {
    --bg: #1e1f22; --painel: #2b2d31; --painel2: #383a40;
    --texto: #f2f3f5; --suave: #a0a6ae;
    --destaque: #5865f2; --destaque-texto: #ffffff;
    --borda: #0b0b0d;
    --ok: #3ba55d; --alerta: #faa61a; --erro: #ed4245;
    --pixel: 'Deltarune', 'Press Start 2P', 'Courier New', monospace;
    --corpo: 'Deltarune', 'VT323', 'Courier New', monospace;
    /* tamanhos: fontes pixel ficam mais nítidas em múltiplos de 8px */
    --t-corpo: 24px; --t-titulo: 16px; --t-pequeno: 16px;
  }
  :root[data-tema="claro"] {
    --bg: #dfe1e5; --painel: #f2f3f5; --painel2: #ffffff;
    --texto: #23262b; --suave: #5c6370;
    --borda: #23262b;
  }

  * { box-sizing: border-box; border-radius: 0; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--texto); font-family: var(--corpo); font-size: var(--t-corpo); line-height: 1.2; }

  /* ===== TOPO ===== */
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: .8rem 1rem; background: var(--painel); border-bottom: 4px solid var(--borda); }
  .logo { display: flex; align-items: center; gap: .8rem; font-family: var(--pixel); font-size: var(--t-titulo); }
  .logo .syt { color: var(--destaque); }
  .logo svg { width: 34px; height: 34px; flex: none; }

  /* ===== LAYOUT ===== */
  #app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.2rem; max-width: 1400px; margin: 1.2rem auto; padding: 0 1rem; }
  #app.com-lateral { grid-template-columns: minmax(0, 1fr) 340px; }
  @media (max-width: 900px) { #app.com-lateral { grid-template-columns: minmax(0, 1fr); } }

  /* ===== CARTÕES ===== */
  #ui, #hostinfo, #aviso, #barra, #config, #painel { background: var(--painel); border: 4px solid var(--borda); box-shadow: 6px 6px 0 var(--borda); padding: .9rem 1rem; margin-bottom: 1.2rem; }
  #ui:empty, #hostinfo:empty, #aviso:empty, #barra:empty, #config:empty, #painel:empty { display: none; }
  #ui { text-align: center; }
  #aviso { border-color: var(--alerta); color: var(--alerta); }
  #hostinfo { display: flex; align-items: center; justify-content: center; gap: .7rem; }

  /* ===== TELA ===== */
  .tela { position: relative; aspect-ratio: 16 / 9; background: #000; border: 4px solid var(--borda); box-shadow: 6px 6px 0 var(--borda); margin-bottom: 1.2rem; }
  .tela video { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .tela.ativo video { display: block; }
  #vazio { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; font-family: var(--pixel); font-size: var(--t-titulo); line-height: 1.6; color: #9aa0a8; animation: piscar 1.2s steps(2) infinite; }
  .tela.ativo #vazio { display: none; }

  /* ===== BOTÕES E CAMPOS ===== */
  button, .btn-arquivo { font-family: var(--corpo); font-size: var(--t-corpo); text-transform: uppercase; padding: .3rem .9rem; color: var(--destaque-texto); background: var(--destaque); border: 3px solid var(--borda); box-shadow: 4px 4px 0 var(--borda); cursor: pointer; margin: .2rem; }
  button:hover, .btn-arquivo:hover { filter: brightness(1.12); }
  button:active, .btn-arquivo:active { transform: translate(4px, 4px); box-shadow: none; }
  button:disabled { background: var(--painel2); color: var(--suave); cursor: not-allowed; box-shadow: 2px 2px 0 var(--borda); }
  button.sec, .btn-arquivo { background: var(--painel2); color: var(--texto); }
  button.perigo { background: var(--erro); color: #fff; }
  .btn-arquivo { display: inline-block; }

  input[type=text], input:not([type]), select { font-family: var(--corpo); font-size: var(--t-corpo); background: var(--bg); color: var(--texto); border: 3px solid var(--borda); padding: .3rem .6rem; width: 90%; max-width: 480px; margin: .3rem 0; }
  select { width: auto; max-width: 100%; background: var(--painel2); }
  input[type=checkbox] { width: auto; accent-color: var(--destaque); transform: scale(1.4); margin-right: .5rem; }
  input[type=range] { accent-color: var(--destaque); }
  small { color: var(--suave); font-size: var(--t-pequeno); }

  /* ===== PAINEL DE ESPECTADORES ===== */
  .titulo { font-family: var(--pixel); font-size: var(--t-titulo); display: flex; justify-content: space-between; align-items: center; margin-bottom: .8rem; }
  #contador { display: inline-block; }
  #contador.pulso { animation: pulso .4s steps(4); }

  .pessoa { display: flex; align-items: center; gap: .7rem; padding: .4rem .5rem; background: var(--painel2); border: 3px solid var(--borda); margin: .5rem 0; max-height: 90px; overflow: hidden; }
  .pessoa.entra { animation: entra .45s steps(8) both; }
  .pessoa.sai { animation: sai .4s steps(6) both; }
  .avatar { width: 40px; height: 40px; object-fit: cover; flex: none; border: 3px solid var(--borda); image-rendering: pixelated; }
  .avatar.letra { background: var(--destaque); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--pixel); font-size: var(--t-titulo); }
  .estado { font-size: var(--t-pequeno); color: var(--suave); display: flex; align-items: center; gap: .4rem; }
  .estado::before { content: ''; width: 10px; height: 10px; background: var(--suave); display: inline-block; flex: none; }
  .estado.ok::before { background: var(--ok); }
  .estado.dorme::before { background: var(--alerta); }
  .estado.sem::before { background: var(--erro); }
  .estado.live::before { background: var(--erro); animation: piscar 1s steps(2) infinite; }

  #preview .avatar { width: 80px; height: 80px; margin-bottom: .5rem; }
  #hostinfo .avatar { width: 34px; height: 34px; }

  /* ===== CONFIGURAÇÃO DE SONS ===== */
  #config summary { cursor: pointer; font-family: var(--pixel); font-size: var(--t-titulo); }
  .cfg-linha { background: var(--painel2); border: 3px solid var(--borda); padding: .5rem .6rem; margin: .6rem 0; }
  .cfg-linha > div:first-child { margin-bottom: .3rem; }
  .cfg-linha button, .cfg-linha .btn-arquivo { font-size: var(--t-pequeno); padding: .15rem .6rem; }

  .controles { display: flex; align-items: center; justify-content: center; gap: .5rem; flex-wrap: wrap; }

  /* ===== AVISOS (TOASTS) ===== */
  #toasts { position: fixed; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .6rem; z-index: 50; pointer-events: none; }
  .toast { background: var(--painel); color: var(--texto); border: 4px solid var(--borda); box-shadow: 4px 4px 0 var(--borda); padding: .5rem .9rem; animation: entra .4s steps(6) both, sumir .4s steps(4) 2.8s forwards; }
  .toast.entrou { border-left: 14px solid var(--ok); }
  .toast.saiu { border-left: 14px solid var(--erro); }

  /* ===== ANIMAÇÕES ===== */
  @keyframes entra { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  @keyframes sai { to { opacity: 0; transform: translateX(-30px); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; border-width: 0; } }
  @keyframes sumir { to { opacity: 0; transform: translateY(12px); } }
  @keyframes piscar { 50% { opacity: 0; } }
  @keyframes pulso { 50% { transform: scale(1.6); color: var(--destaque); } }
</style>
</head>
<body>

<header class="topo">
  <div class="logo">
    <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="0" y="0" width="8" height="6" fill="#5865f2"/>
      <rect x="1" y="1" width="6" height="4" fill="#111214"/>
      <rect x="2" y="1" width="1" height="4" fill="#ffffff"/>
      <rect x="3" y="2" width="1" height="2" fill="#ffffff"/>
      <rect x="3" y="6" width="2" height="1" fill="#5865f2"/>
      <rect x="2" y="7" width="4" height="1" fill="#5865f2"/>
    </svg>
    <span>Screentoyoutoo<span class="syt">.SYT</span></span>
  </div>
  <button id="tema" class="sec"></button>
</header>

<main id="app">
  <section id="palco">
    <div id="ui"></div>
    <div id="hostinfo"></div>
    <div id="aviso"></div>
    <div class="tela" id="tela">
      <video id="v" autoplay playsinline></video>
      <div id="vazio">AGUARDANDO...</div>
    </div>
    <div id="barra"></div>
  </section>
  <aside id="lateral" hidden>
    <div id="config"></div>
    <div id="painel"></div>
  </aside>
</main>

<div id="toasts"></div>

<script>
// ===== CONFIGURAÇÕES =====
const MAX_PESSOAS = 10;          // contando com quem transmite
const BITRATE = 1500000;         // 1.5 Mbps por espectador (baixe se a sua internet for fraca)
const INTERVALO_STATUS = 3000;   // espectador avisa o status a cada 3s
const TEMPO_SEM_SINAL = 9000;    // se ficar 9s sem avisar, aparece "sem sinal"
const TAMANHO_MAX_SOM = 1000000; // sons escolhidos do seu PC: máximo ~1 MB

// Sons que estão no repositório (na mesma pasta do index.html).
// Pra adicionar mais, suba o arquivo no GitHub e acrescente uma linha aqui.
const SONS_PRONTOS = [
  { nome: 'Ronaldo',         arquivo: 'ronaldo.mp3' },
  { nome: 'Otkaz v dostupe', arquivo: 'otkaz-v-dostupe.mp3' },
  { nome: 'Ne nazhimaetsia', arquivo: 'ne-nazhimaetsia.mp3' },
  { nome: 'Access denied',   arquivo: 'access-denied_Is238Ly.mp3' },
  { nome: 'Vybor rezhima',   arquivo: 'vybor-rezhima.mp3' },
];

const ui = document.getElementById('ui');
const painel = document.getElementById('painel');
const cfgBox = document.getElementById('config');
const hostInfo = document.getElementById('hostinfo');
const aviso = document.getElementById('aviso');
const barra = document.getElementById('barra');
const tela = document.getElementById('tela');
const vazio = document.getElementById('vazio');
const lateral = document.getElementById('lateral');
const app = document.getElementById('app');
const toasts = document.getElementById('toasts');
const video = document.getElementById('v');
const btnTema = document.getElementById('tema');
const hostId = location.hash.slice(1); // se tiver #id na URL, é espectador

// ===== FUNÇÕES AUXILIARES =====
function lerSalvo(chave, padrao) {
  try {
    const v = JSON.parse(localStorage.getItem(chave));
    return v ? Object.assign({}, padrao, v) : padrao;
  } catch (e) { return padrao; }
}
function gravarSalvo(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); return true; }
  catch (e) { return false; }
}

// tema claro/escuro (lembra a escolha)
function aplicarTema(t) {
  document.documentElement.dataset.tema = t;
  btnTema.textContent = t === 'claro' ? '☾ Tema escuro' : '☀ Tema claro';
  gravarSalvo('syt-tema', { tema: t });
}
aplicarTema(lerSalvo('syt-tema', { tema: 'escuro' }).tema === 'claro' ? 'claro' : 'escuro');
btnTema.onclick = () => aplicarTema(document.documentElement.dataset.tema === 'claro' ? 'escuro' : 'claro');

// área do vídeo: mostra o vídeo ou o texto de espera
function telaAtiva(on, textoVazio) {
  tela.classList.toggle('ativo', on);
  if (textoVazio) vazio.textContent = textoVazio;
}

// aviso no canto da tela (entrou/saiu)
function toast(texto, tipo) {
  const t = document.createElement('div');
  t.className = 'toast ' + (tipo || '');
  t.textContent = texto;
  toasts.appendChild(t);
  setTimeout(() => t.remove(), 3300);
}

// foto: corta no centro, reduz pra 96x96 e vira um JPEG pequeno (~4 KB)
function reduzirFoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const lado = Math.min(img.width, img.height);
      const sx = (img.width - lado) / 2, sy = (img.height - lado) / 2;
      const c = document.createElement('canvas');
      c.width = c.height = 96;
      c.getContext('2d').drawImage(img, sx, sy, lado, lado, 0, 0, 96, 96);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagem inválida')); };
    img.src = url;
  });
}

// só aceita foto pequena em JPEG (não se confia em qualquer coisa que chega pela rede)
function fotoValida(f) {
  return typeof f === 'string' && f.length < 30000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(f);
}

function criarAvatar(nome, foto) {
  if (fotoValida(foto)) {
    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = foto;
    return img;
  }
  const d = document.createElement('div');
  d.className = 'avatar letra';
  d.textContent = (nome || '?').trim().charAt(0).toUpperCase() || '?';
  return d;
}

// linha da lista de espectadores (criada uma vez e só atualizada depois, pra animação tocar só na entrada)
function criarLinha() {
  const el = document.createElement('div');
  el.className = 'pessoa';
  const avatarEl = document.createElement('div');
  const info = document.createElement('div');
  const nomeEl = document.createElement('div');
  const estadoEl = document.createElement('div');
  estadoEl.className = 'estado';
  info.append(nomeEl, estadoEl);
  el.append(avatarEl, info);
  return { el: el, avatarEl: avatarEl, nomeEl: nomeEl, estadoEl: estadoEl, chave: null };
}
function atualizarLinha(l, nome, foto, e) {
  const chave = nome + '|' + (foto || '');
  if (l.chave !== chave) {
    const novo = criarAvatar(nome, foto);
    l.avatarEl.replaceWith(novo);
    l.avatarEl = novo;
    l.chave = chave;
  }
  l.nomeEl.textContent = nome; // textContent evita código malicioso nos nomes
  l.estadoEl.textContent = e.texto;
  l.estadoEl.className = 'estado ' + e.classe;
}

// formulário de nome + foto (usado por quem transmite e por quem assiste)
function formPerfil(chave, textoBotao, idBotao, dica) {
  const perfil = lerSalvo(chave, { nome: '', foto: null });

  ui.innerHTML = '<div id="preview"></div>' +
    '<input id="nome" placeholder="Seu nome" maxlength="20"><br>' +
    '<label class="btn-arquivo">Escolher foto (opcional)<input type="file" id="foto" accept="image/*" style="display:none"></label><br><br>' +
    '<button id="' + idBotao + '">' + textoBotao + '</button><br>' +
    '<small>' + dica + '</small>';

  const nomeEl = document.getElementById('nome');
  const prev = document.getElementById('preview');
  nomeEl.value = perfil.nome || '';

  function mostrarPreview() {
    prev.innerHTML = '';
    if (fotoValida(perfil.foto)) prev.appendChild(criarAvatar('', perfil.foto));
  }
  mostrarPreview();

  document.getElementById('foto').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    reduzirFoto(f).then(d => { perfil.foto = d; mostrarPreview(); })
                  .catch(() => alert('Não consegui abrir essa imagem.'));
  };

  // chamada quando o botão é clicado: pega o nome, salva e devolve o perfil
  return function confirmar(nomePadrao) {
    perfil.nome = nomeEl.value.trim() || nomePadrao;
    gravarSalvo(chave, perfil); // lembra nome e foto da próxima vez
    return perfil;
  };
}

if (hostId) modoEspectador(); else modoTransmissor();

// ===== QUEM TRANSMITE =====
function modoTransmissor() {
  telaAtiva(false, 'AGUARDANDO TRANSMISSÃO...');
  const confirmar = formPerfil('syt-perfil-host', 'Começar a transmitir', 'go',
    'Os espectadores vão ver seu nome e sua foto.');

  document.getElementById('go').onclick = async () => {
    const perfil = confirmar('Anônimo');

    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30 },
        audio: true
      });
    } catch (e) {
      return; // cancelou a escolha da tela
    }
    video.srcObject = stream;
    video.muted = true; // evita eco da sua própria transmissão
    telaAtiva(true);
    lateral.hidden = false;
    app.classList.add('com-lateral');

    // ----- sons de aviso (entrou/saiu) -----
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let somLigado = true;
    let cfgAberto = false;

    // fonte: 'bipe', 'p0'...'p4' (sons prontos) ou 'custom' (arquivo escolhido do PC)
    const config = lerSalvo('syt-sons', {
      entrou: { fonte: 'p0', custom: null },
      saiu:   { fonte: 'p3', custom: null },
      volume: 0.6
    });

    function salvarConfig() {
      if (!gravarSalvo('syt-sons', config)) {
        alert('Não deu pra salvar pra próxima vez (arquivo grande demais pro navegador), mas vale nesta sessão.');
      }
    }

    function beep(freq) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // toca o som configurado pro evento ('entrou' ou 'saiu'); forcar = ignora o "mudo" (botão de teste)
    function tocar(ev, forcar) {
      if (!somLigado && !forcar) return;
      const reserva = ev === 'entrou' ? 880 : 440;
      const c = config[ev];
      let src = null;
      if (c.fonte === 'custom' && c.custom) src = c.custom.data;
      else if (/^p\d+$/.test(c.fonte) && SONS_PRONTOS[+c.fonte.slice(1)]) src = SONS_PRONTOS[+c.fonte.slice(1)].arquivo;
      if (!src) { beep(reserva); return; }
      const a = new Audio(src);
      a.volume = config.volume;
      a.play().catch(() => beep(reserva)); // se der erro (arquivo não encontrado etc.), toca o bipe
    }

    function escolherArquivo(ev, file) {
      if (!file) return;
      if (file.size > TAMANHO_MAX_SOM) {
        alert('Arquivo grande demais (máximo ~1 MB). Use um som curto.');
        return;
      }
      const r = new FileReader();
      r.onload = () => {
        config[ev].custom = { nome: file.name, data: r.result };
        config[ev].fonte = 'custom';
        salvarConfig();
        desenharConfig();
      };
      r.readAsDataURL(file);
    }

    function desenharConfig() {
      cfgBox.innerHTML = '';
      const det = document.createElement('details');
      det.open = cfgAberto;
      det.ontoggle = () => { cfgAberto = det.open; };
      const sum = document.createElement('summary');
      sum.textContent = 'Configurar sons';
      det.appendChild(sum);

      [['entrou', 'Quando alguém entra'], ['saiu', 'Quando alguém sai']].forEach(([ev, rotulo]) => {
        const linha = document.createElement('div');
        linha.className = 'cfg-linha';
        const lab = document.createElement('div');
        lab.textContent = rotulo;

        const sel = document.createElement('select');
        const ops = [['bipe', 'Bipe simples']];
        SONS_PRONTOS.forEach((s, i) => ops.push(['p' + i, s.nome]));
        if (config[ev].custom) ops.push(['custom', 'Arquivo: ' + config[ev].custom.nome]);
        ops.forEach(([valor, texto]) => {
          const o = document.createElement('option');
          o.value = valor;
          o.textContent = texto;
          sel.appendChild(o);
        });
        sel.value = config[ev].fonte;
        sel.onchange = () => { config[ev].fonte = sel.value; salvarConfig(); };

        const arq = document.createElement('label');
        arq.className = 'btn-arquivo';
        arq.textContent = 'Escolher arquivo';
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'audio/*';
        inp.style.display = 'none';
        inp.onchange = () => escolherArquivo(ev, inp.files[0]);
        arq.appendChild(inp);

        const teste = document.createElement('button');
        teste.className = 'sec';
        teste.textContent = 'Testar';
        teste.onclick = () => tocar(ev, true);

        linha.append(lab, sel, document.createTextNode(' '), arq, document.createTextNode(' '), teste);
        det.appendChild(linha);
      });

      const vl = document.createElement('div');
      vl.className = 'cfg-linha';
      vl.appendChild(document.createTextNode('Volume: '));
      const rng = document.createElement('input');
      rng.type = 'range';
      rng.min = 0; rng.max = 100;
      rng.value = Math.round(config.volume * 100);
      rng.style.width = '60%';
      rng.onchange = () => { config.volume = rng.value / 100; salvarConfig(); };
      vl.appendChild(rng);
      det.appendChild(vl);

      const rest = document.createElement('button');
      rest.className = 'sec';
      rest.textContent = 'Restaurar padrão';
      rest.onclick = () => {
        config.entrou = { fonte: 'p0', custom: null };
        config.saiu = { fonte: 'p3', custom: null };
        config.volume = 0.6;
        salvarConfig();
        desenharConfig();
      };
      det.appendChild(rest);

      cfgBox.appendChild(det);
    }

    // ----- painel de espectadores -----
    painel.innerHTML = '';
    const tituloEl = document.createElement('div');
    tituloEl.className = 'titulo';
    const tituloTxt = document.createElement('span');
    tituloTxt.textContent = 'Na sala';
    const contador = document.createElement('span');
    contador.id = 'contador';
    tituloEl.append(tituloTxt, contador);
    const lista = document.createElement('div');
    painel.append(tituloEl, lista);

    const linhas = new Map(); // id -> linha da lista
    const linhaEu = criarLinha();
    lista.appendChild(linhaEu.el);
    atualizarLinha(linhaEu, perfil.nome + ' (você)', perfil.foto, { texto: 'transmitindo', classe: 'live' });

    function pulsar() {
      contador.classList.remove('pulso');
      void contador.offsetWidth; // reinicia a animação
      contador.classList.add('pulso');
    }

    // ----- conexão -----
    const peer = new Peer();
    const viewers = new Map(); // id -> { conn, nome, foto, visivel, ultimo }
    let timer;
    let encerrado = false;
    let mudo = false; // áudio da transmissão silenciado pra todo mundo

    // liga/desliga o áudio que vai pros espectadores
    function alternarMudo() {
      const faixas = stream.getAudioTracks();
      if (!faixas.length) return;
      mudo = !mudo;
      faixas.forEach(t => { t.enabled = !mudo; });
      atualizarBotaoMudo();
      viewers.forEach(v => {
        try { v.conn.send({ tipo: 'mudo', mudo: mudo }); } catch (e) {}
      });
    }

    function atualizarBotaoMudo() {
      const b = document.getElementById('mutar');
      if (!b) return;
      if (!stream.getAudioTracks().length) {
        b.disabled = true;
        b.textContent = 'Sem áudio compartilhado';
        return;
      }
      b.textContent = mudo ? 'Reativar áudio' : 'Mutar áudio da transmissão';
    }

    // encerra tudo: para de capturar a tela, desconecta os amigos e limpa a página
    function parar() {
      if (encerrado) return;
      encerrado = true;
      clearInterval(timer);
      stream.getTracks().forEach(t => t.stop());
      peer.destroy();
      viewers.clear();
      linhas.clear();
      video.srcObject = null;
      painel.innerHTML = '';
      cfgBox.innerHTML = '';
      lateral.hidden = true;
      app.classList.remove('com-lateral');
      telaAtiva(false, 'TRANSMISSÃO ENCERRADA');
      ui.innerHTML = 'Transmissão encerrada.<br><button onclick="location.reload()">Começar de novo</button>';
    }
    // se você clicar em "Parar compartilhamento" na barra do navegador, também encerra
    stream.getVideoTracks()[0].onended = parar;

    peer.on('open', id => {
      const link = location.href.split('#')[0] + '#' + id;
      ui.innerHTML = 'Mande este link pros amigos:<br><input readonly value="' + link + '" onclick="this.select()">' +
        '<br><label><input type="checkbox" id="som" checked> Som de aviso quando alguém entrar/sair</label>' +
        '<br><br><button id="mutar" class="sec">Mutar áudio da transmissão</button>' +
        '<button id="parar" class="perigo">Parar transmissão</button>';
      document.getElementById('som').onchange = e => { somLigado = e.target.checked; };
      document.getElementById('mutar').onclick = alternarMudo;
      document.getElementById('parar').onclick = parar;
      atualizarBotaoMudo();
      desenharConfig();
    });

    // um espectador entrou: liga pra ele mandando a tela
    peer.on('connection', conn => {
      let call = null;

      conn.on('open', () => {
        if (viewers.size >= MAX_PESSOAS - 1) {
          conn.send({ tipo: 'cheio' });
          setTimeout(() => conn.close(), 500);
          return;
        }
        viewers.set(conn.peer, { conn: conn, nome: 'Alguém', foto: null, visivel: true, ultimo: Date.now() });
        call = peer.call(conn.peer, stream);
        limitarBitrate(call);
        render();
      });

      conn.on('data', d => {
        const v = viewers.get(conn.peer);
        if (!v || !d) return;
        v.ultimo = Date.now();
        if (d.tipo === 'oi') {
          v.nome = String(d.nome || 'Alguém').slice(0, 20);
          v.foto = fotoValida(d.foto) ? d.foto : null;
          // responde com quem está transmitindo e se o áudio está mutado
          conn.send({ tipo: 'host', nome: perfil.nome, foto: perfil.foto, mudo: mudo });
          toast(v.nome + ' entrou', 'entrou');
          tocar('entrou');
        } else if (d.tipo === 'status') {
          v.visivel = !!d.visivel;
        }
        render();
      });

      conn.on('close', () => {
        const v = viewers.get(conn.peer);
        if (v && viewers.delete(conn.peer)) {
          toast(v.nome + ' saiu', 'saiu');
          tocar('saiu');
        }
        if (call) call.close();
        render();
      });
    });

    function estado(v) {
      if (Date.now() - v.ultimo > TEMPO_SEM_SINAL) return { texto: 'sem sinal', classe: 'sem' };
      if (!v.visivel) return { texto: 'aba em segundo plano', classe: 'dorme' };
      return { texto: 'assistindo', classe: 'ok' };
    }

    function render() {
      if (encerrado) return;
      const txt = viewers.size + '/' + (MAX_PESSOAS - 1);
      if (contador.textContent !== txt) { contador.textContent = txt; pulsar(); }

      viewers.forEach((v, id) => {
        let l = linhas.get(id);
        if (!l) { // pessoa nova: cria a linha com animação de entrada
          l = criarLinha();
          l.el.classList.add('entra');
          lista.appendChild(l.el);
          linhas.set(id, l);
        }
        atualizarLinha(l, v.nome, v.foto, estado(v));
      });

      linhas.forEach((l, id) => { // pessoa saiu: animação de saída e remove
        if (!viewers.has(id)) {
          l.el.classList.remove('entra');
          l.el.classList.add('sai');
          setTimeout(() => l.el.remove(), 450);
          linhas.delete(id);
        }
      });
    }

    render();
    timer = setInterval(render, 2000); // atualiza o "sem sinal" mesmo se ninguém mandar nada
  };
}

function limitarBitrate(call) {
  setTimeout(() => {
    call.peerConnection.getSenders().forEach(s => {
      if (s.track && s.track.kind === 'video') {
        const p = s.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = BITRATE;
        s.setParameters(p);
      }
    });
  }, 1000);
}

// ===== QUEM ASSISTE =====
function modoEspectador() {
  telaAtiva(false, 'ENTRE PARA ASSISTIR');
  const confirmar = formPerfil('syt-perfil', 'Assistir', 'join',
    'Quem transmite vê seu nome, sua foto e se você está com a aba aberta.');

  document.getElementById('join').onclick = () => {
    const perfil = confirmar('Alguém');

    ui.textContent = 'Conectando...';
    telaAtiva(false, 'CONECTANDO...');
    const peer = new Peer();
    let statusTimer;
    let saiu = false;
    let montado = false;

    // sai da transmissão: desconecta e mostra um botão pra entrar de novo
    function sair(msg) {
      if (saiu) return;
      saiu = true;
      clearInterval(statusTimer);
      peer.destroy();
      video.srcObject = null;
      hostInfo.innerHTML = '';
      aviso.textContent = '';
      barra.innerHTML = '';
      telaAtiva(false, 'FIM DA TRANSMISSÃO');
      ui.innerHTML = msg + '<br><button onclick="location.reload()">Entrar de novo</button>';
    }

    // botões do espectador: mutar (só pra ele), volume, tela cheia e sair
    function montarControles() {
      ui.innerHTML = '';
      barra.innerHTML = '<div class="controles">' +
        '<button id="btnMudo" class="sec">Mutar</button>' +
        '<input type="range" id="vol" min="0" max="100" value="100" style="width:130px">' +
        '<button id="btnTela" class="sec">Tela cheia</button>' +
        '<button id="sair" class="perigo">Sair</button>' +
        '</div>';
      const btnMudo = document.getElementById('btnMudo');
      btnMudo.onclick = () => {
        video.muted = !video.muted;
        btnMudo.textContent = video.muted ? 'Ativar som' : 'Mutar';
      };
      document.getElementById('vol').oninput = e => { video.volume = e.target.value / 100; };
      document.getElementById('btnTela').onclick = () => {
        if (video.requestFullscreen) video.requestFullscreen();
      };
      document.getElementById('sair').onclick = () => sair('Você saiu.');
    }

    function mostrarHost(d) {
      hostInfo.innerHTML = '';
      const t = document.createElement('span');
      t.textContent = 'Transmitindo:';
      const n = document.createElement('strong');
      n.textContent = String(d.nome || 'Anônimo').slice(0, 20);
      hostInfo.append(t, criarAvatar(d.nome, d.foto), n);
    }

    function mostrarMudo(mudo) {
      aviso.textContent = mudo ? 'O transmissor silenciou o áudio da transmissão.' : '';
    }

    peer.on('call', call => {
      call.answer(); // não manda nada de volta, só recebe
      call.on('stream', s => {
        if (saiu) return;
        video.srcObject = s;
        telaAtiva(true);
        if (!montado) { montado = true; montarControles(); }
      });
    });

    // transmissão ao vivo não faz sentido pausada: se pausar, volta a tocar
    video.addEventListener('pause', () => {
      if (!saiu && video.srcObject) video.play().catch(() => {});
    });

    peer.on('open', () => {
      const conn = peer.connect(hostId);

      conn.on('open', () => {
        conn.send({ tipo: 'oi', nome: perfil.nome, foto: fotoValida(perfil.foto) ? perfil.foto : null });

        function enviarStatus() {
          if (saiu || !conn.open) return;
          conn.send({ tipo: 'status', visivel: !document.hidden });
        }
        enviarStatus();
        statusTimer = setInterval(enviarStatus, INTERVALO_STATUS);
        document.addEventListener('visibilitychange', enviarStatus);
      });

      conn.on('data', d => {
        if (!d) return;
        if (d.tipo === 'cheio') sair('A sala está cheia.');
        else if (d.tipo === 'host') { mostrarHost(d); mostrarMudo(!!d.mudo); }
        else if (d.tipo === 'mudo') mostrarMudo(!!d.mudo);
      });

      // se quem transmite parar ou cair, avisa
      conn.on('close', () => sair('A transmissão acabou.'));
    });
  };
}
