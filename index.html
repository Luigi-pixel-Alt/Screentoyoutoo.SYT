<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screentoyoutoo.SYT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  /* ===== FONTE (estilo Deltarune) =====
     Coloque o arquivo da fonte na mesma pasta do index.html com o nome fonte.ttf.
     Se o arquivo não existir, o site usa as fontes pixel do Google Fonts no lugar. */
  @font-face { font-family: 'Deltarune'; src: url('fonte.ttf') format('truetype'); font-display: swap; }

  /* ===== TEMAS ===== */
  :root {
    --bg: #1e1f22; --painel: #2b2d31; --painel2: #383a40;
    --texto: #f2f3f5; --suave: #a0a6ae;
    --destaque: #5865f2; --destaque-texto: #ffffff;
    --borda: #0b0b0d;
    --ok: #3ba55d; --alerta: #faa61a; --erro: #ed4245;
    --pixel: 'Deltarune', 'Press Start 2P', 'Courier New', monospace;
    --corpo: 'Deltarune', 'VT323', 'Courier New', monospace;
    /* tamanhos: fontes pixel ficam mais nítidas em múltiplos de 8px */
    --t-corpo: 24px; --t-titulo: 16px; --t-pequeno: 16px;
  }
  :root[data-tema="claro"] {
    --bg: #dfe1e5; --painel: #f2f3f5; --painel2: #ffffff;
    --texto: #23262b; --suave: #5c6370;
    --borda: #23262b;
  }

  * { box-sizing: border-box; border-radius: 0; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--texto); font-family: var(--corpo); font-size: var(--t-corpo); line-height: 1.2; }

  /* ===== TOPO ===== */
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: .8rem 1rem; background: var(--painel); border-bottom: 4px solid var(--borda); }
  .logo { display: flex; align-items: center; gap: .8rem; font-family: var(--pixel); font-size: var(--t-titulo); }
  .logo .syt { color: var(--destaque); }
  .logo svg { width: 34px; height: 34px; flex: none; }

  /* ===== LAYOUT ===== */
  #app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.2rem; max-width: 1400px; margin: 1.2rem auto; padding: 0 1rem; }
  #app.com-lateral { grid-template-columns: minmax(0, 1fr) 340px; }
  @media (max-width: 900px) { #app.com-lateral { grid-template-columns: minmax(0, 1fr); } }

  /* ===== CARTÕES ===== */
  #ui, #config, #painel, #musica, #chat { background: var(--painel); border: 4px solid var(--borda); box-shadow: 6px 6px 0 var(--borda); padding: .9rem 1rem; margin-bottom: 1.2rem; }
  #ui:empty, #config:empty, #painel:empty, #musica:empty, #chat:empty { display: none; }
  #ui { text-align: center; }
  /* barra de cima da sala: quem é o dono + botões */
  #ui.sala { display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; text-align: left; }
  #ui.sala .sala-info { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  #ui.sala .sala-info .avatar { width: 34px; height: 34px; }
  #ui.sala .controles { margin-top: 0; justify-content: flex-end; }

  /* abas da coluna lateral: uma coisa de cada vez */
  #abas { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.2rem; }
  #abas:empty { display: none; }
  #abas button { margin: 0; flex: 1 1 auto; padding: .2rem .5rem; font-size: var(--t-pequeno); }

  /* ===== TELAS (uma por pessoa que está transmitindo) ===== */
  #telas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 1.2rem; margin-bottom: 1.2rem; }
  .tela { position: relative; aspect-ratio: 16 / 9; background: #000; border: 4px solid var(--borda); box-shadow: 6px 6px 0 var(--borda); }
  .tela video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .vazio-tela { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; }
  .vazio-txt { font-family: var(--pixel); font-size: var(--t-titulo); line-height: 1.6; color: #9aa0a8; animation: piscar 1.2s steps(2) infinite; }

  .tile-barra { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; margin-top: .7rem; padding: .4rem .6rem; background: var(--painel); border: 3px solid var(--borda); }
  .tile-quem { display: flex; align-items: center; gap: .5rem; min-width: 0; }
  .tile-quem .avatar { width: 30px; height: 30px; }
  .tile-tag { color: var(--alerta); font-size: var(--t-pequeno); }
  .tile-ctl { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
  .tile-ctl button { margin: 0; padding: .1rem .6rem; font-size: var(--t-pequeno); }
  .tile-ctl input[type=range] { width: 80px; }

  /* tela cheia: o quadro inteiro (e não só o <video>) fica em tela cheia, sem a barra nativa do navegador */
  .tela:fullscreen { aspect-ratio: auto; width: 100%; height: 100%; border: 0; box-shadow: none; margin: 0; }
  .tela:-webkit-full-screen { aspect-ratio: auto; width: 100%; height: 100%; border: 0; box-shadow: none; margin: 0; }
  .tela.parado { cursor: none; }
  .ov-tela { position: absolute; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; gap: .6rem; flex-wrap: wrap; padding: 1rem; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.75)); transition: opacity .2s; z-index: 3; }
  .tela:fullscreen .ov-tela { display: flex; }
  .tela:-webkit-full-screen .ov-tela { display: flex; }
  .ov-tela.oculto { opacity: 0; pointer-events: none; }

  /* ===== BOTÕES E CAMPOS ===== */
  button, .btn-arquivo { font-family: var(--corpo); font-size: var(--t-corpo); text-transform: uppercase; padding: .3rem .9rem; color: var(--destaque-texto); background: var(--destaque); border: 3px solid var(--borda); box-shadow: 4px 4px 0 var(--borda); cursor: pointer; margin: .2rem; }
  button:hover, .btn-arquivo:hover { filter: brightness(1.12); }
  button:active, .btn-arquivo:active { transform: translate(4px, 4px); box-shadow: none; }
  button:disabled { background: var(--painel2); color: var(--suave); cursor: not-allowed; box-shadow: 2px 2px 0 var(--borda); }
  button.sec, .btn-arquivo { background: var(--painel2); color: var(--texto); }
  button.perigo { background: var(--erro); color: #fff; }
  .btn-arquivo { display: inline-block; }

  input[type=text], input[type=password], input:not([type]), select { font-family: var(--corpo); font-size: var(--t-corpo); background: var(--bg); color: var(--texto); border: 3px solid var(--borda); padding: .3rem .6rem; width: 90%; max-width: 480px; margin: .3rem 0; }
  select { width: auto; max-width: 100%; background: var(--painel2); }
  input[type=checkbox] { width: auto; accent-color: var(--destaque); transform: scale(1.4); margin-right: .5rem; }
  input[type=range] { accent-color: var(--destaque); }
  small { color: var(--suave); font-size: var(--t-pequeno); }

  .controles { display: flex; align-items: center; justify-content: center; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }

  /* ===== LISTA DE PESSOAS ===== */
  .titulo { font-family: var(--pixel); font-size: var(--t-titulo); display: flex; justify-content: space-between; align-items: center; margin-bottom: .8rem; }
  #contador { display: inline-block; }
  #contador.pulso { animation: pulso .4s steps(4); }

  .pessoa { display: flex; align-items: center; gap: .7rem; padding: .4rem .5rem; background: var(--painel2); border: 3px solid var(--borda); margin: .5rem 0; max-height: 90px; overflow: hidden; }
  .pessoa.entra { animation: entra .45s steps(8) both; }
  .pessoa.sai { animation: sai .4s steps(6) both; }
  .pessoa button { margin: 0 0 0 auto; padding: .1rem .5rem; font-size: var(--t-pequeno); }
  .avatar { width: 40px; height: 40px; object-fit: cover; flex: none; border: 3px solid var(--borda); image-rendering: pixelated; }
  .avatar.letra { background: var(--destaque); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--pixel); font-size: var(--t-titulo); }
  .estado { font-size: var(--t-pequeno); color: var(--suave); display: flex; align-items: center; gap: .4rem; }
  .estado::before { content: ''; width: 10px; height: 10px; background: var(--suave); display: inline-block; flex: none; }
  .estado.ok::before { background: var(--ok); }
  .estado.dorme::before { background: var(--alerta); }
  .estado.sem::before { background: var(--erro); }
  .estado.live::before { background: var(--erro); animation: piscar 1s steps(2) infinite; }

  #preview .avatar { width: 80px; height: 80px; margin-bottom: .5rem; }

  /* ===== CONFIGURAÇÃO DE SONS ===== */
  #config summary { cursor: pointer; font-family: var(--pixel); font-size: var(--t-titulo); }
  .cfg-linha { background: var(--painel2); border: 3px solid var(--borda); padding: .5rem .6rem; margin: .6rem 0; }
  .cfg-linha > div:first-child { margin-bottom: .3rem; }
  .cfg-linha button, .cfg-linha .btn-arquivo { font-size: var(--t-pequeno); padding: .15rem .6rem; }

  /* ===== CHAT ===== */
  #msgs { height: 260px; overflow-y: auto; background: var(--bg); border: 3px solid var(--borda); padding: .4rem .5rem; margin-bottom: .6rem; }
  .msg { margin: .35rem 0; overflow-wrap: anywhere; animation: entra .3s steps(5) both; }
  .msg .quem { margin-right: .4rem; }
  .msg.sistema { color: var(--suave); }
  .msg img.desenho { display: block; max-width: 100%; margin-top: .3rem; border: 3px solid var(--borda); background: #fff; }
  .chat-form { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .chat-form input { flex: 1 1 100%; min-width: 0; width: auto; max-width: none; margin: 0; }
  .chat-form button { margin: 0; padding: .3rem .6rem; }
  .pad { margin-top: .7rem; }
  .pad canvas { display: block; width: 100%; aspect-ratio: 8 / 5; background: #fff; border: 3px solid var(--borda); touch-action: none; cursor: crosshair; }
  .pad-ferr { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: .5rem 0; }
  .pad-ferr button { margin: 0; padding: .1rem .6rem; font-size: var(--t-pequeno); }
  button.cor { width: 28px; height: 28px; padding: 0; box-shadow: none; }
  button.cor:active { transform: none; }
  button.cor.sel { outline: 3px solid var(--destaque); outline-offset: 2px; }
  button.sel { background: var(--destaque); color: #fff; }

  /* ===== MÚSICA (YouTube) E LINK DO DISCORD ===== */
  .yt-wrap { position: relative; margin: .6rem 0; background: #000; border: 3px solid var(--borda); }
  .yt-wrap iframe { display: block; width: 100%; }
  .yt-bloqueio { position: absolute; inset: 0; z-index: 2; } /* impede de pausar o vídeo clicando nele */
  .musica-ctl { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .5rem; }
  .musica-ctl button { margin: 0; padding: .15rem .6rem; font-size: var(--t-pequeno); }
  a.btn-link { font-family: var(--corpo); font-size: var(--t-pequeno); text-transform: uppercase; text-decoration: none; padding: .15rem .7rem; color: var(--destaque-texto); background: var(--destaque); border: 3px solid var(--borda); box-shadow: 4px 4px 0 var(--borda); }
  a.btn-link:active { transform: translate(4px, 4px); box-shadow: none; }

  /* ===== AVISOS (TOASTS) ===== */
  #toasts { position: fixed; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .6rem; z-index: 50; pointer-events: none; }
  .toast { background: var(--painel); color: var(--texto); border: 4px solid var(--borda); box-shadow: 4px 4px 0 var(--borda); padding: .5rem .9rem; animation: entra .4s steps(6) both, sumir .4s steps(4) 2.8s forwards; }
  .toast.entrou { border-left: 14px solid var(--ok); }
  .toast.saiu { border-left: 14px solid var(--erro); }

  /* ===== ANIMAÇÕES ===== */
  @keyframes entra { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  @keyframes sai { to { opacity: 0; transform: translateX(-30px); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; border-width: 0; } }
  @keyframes sumir { to { opacity: 0; transform: translateY(12px); } }
  @keyframes piscar { 50% { opacity: 0; } }
  @keyframes pulso { 50% { transform: scale(1.6); color: var(--destaque); } }
</style>
</head>
<body>

<header class="topo">
  <div class="logo">
    <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="0" y="0" width="8" height="6" fill="#5865f2"/>
      <rect x="1" y="1" width="6" height="4" fill="#111214"/>
      <rect x="2" y="1" width="1" height="4" fill="#ffffff"/>
      <rect x="3" y="2" width="1" height="2" fill="#ffffff"/>
      <rect x="3" y="6" width="2" height="1" fill="#5865f2"/>
      <rect x="2" y="7" width="4" height="1" fill="#5865f2"/>
    </svg>
    <span>Screentoyoutoo<span class="syt">.SYT</span></span>
  </div>
  <button id="tema" class="sec"></button>
</header>

<main id="app">
  <section id="palco">
    <div id="ui"></div>
    <div id="telas"></div>
  </section>
  <aside id="lateral" hidden>
    <div id="abas"></div>
    <div id="config"></div>
    <div id="painel"></div>
    <div id="musica"></div>
    <div id="chat"></div>
  </aside>
</main>

<div id="toasts"></div>

<script>
// ===== CONFIGURAÇÕES =====
const MAX_PESSOAS = 10;          // contando com o dono da sala
const MAX_TRANSMISSOES = 3;      // telas ao mesmo tempo (cada pessoa baixa todas elas)
const BITRATE = 1500000;         // 1.5 Mbps por espectador (baixe se a sua internet for fraca)
const INTERVALO_STATUS = 3000;   // cada pessoa avisa o status a cada 3s
const TEMPO_SEM_SINAL = 9000;    // se ficar 9s sem avisar, aparece "sem sinal"
const TAMANHO_MAX_SOM = 1000000; // sons escolhidos do seu PC: máximo ~1 MB
const TEMPO_ENTRADA = 15000;     // se não conseguir entrar na sala em 15s, avisa o que pode ser

// Sons que estão no repositório (na mesma pasta do index.html).
// Pra adicionar mais, suba o arquivo no GitHub e acrescente uma linha aqui.
const SONS_PRONTOS = [
  { nome: 'Ronaldo',         arquivo: 'ronaldo.mp3' },
  { nome: 'Otkaz v dostupe', arquivo: 'otkaz-v-dostupe.mp3' },
  { nome: 'Ne nazhimaetsia', arquivo: 'ne-nazhimaetsia.mp3' },
  { nome: 'Access denied',   arquivo: 'access-denied_Is238Ly.mp3' },
  { nome: 'Vybor rezhima',   arquivo: 'vybor-rezhima.mp3' },
];

const $ = id => document.getElementById(id);
const ui = $('ui');
const telas = $('telas');
const lateral = $('lateral');
const app = $('app');
const painel = $('painel');
const cfgBox = $('config');
const musicaBox = $('musica');
const chatBox = $('chat');
const toasts = $('toasts');
const btnTema = $('tema');
const hostId = location.hash.slice(1); // se tiver #id na URL, a pessoa vai entrar numa sala; senão, vai criar uma

// ===== FUNÇÕES AUXILIARES =====
function lerSalvo(chave, padrao) {
  try {
    const v = JSON.parse(localStorage.getItem(chave));
    return v ? Object.assign({}, padrao, v) : padrao;
  } catch (e) { return padrao; }
}
function gravarSalvo(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); return true; }
  catch (e) { return false; }
}

// tema claro/escuro (lembra a escolha)
function aplicarTema(t) {
  document.documentElement.dataset.tema = t;
  btnTema.textContent = t === 'claro' ? '☾ Tema escuro' : '☀ Tema claro';
  gravarSalvo('syt-tema', { tema: t });
}
aplicarTema(lerSalvo('syt-tema', { tema: 'escuro' }).tema === 'claro' ? 'claro' : 'escuro');
btnTema.onclick = () => aplicarTema(document.documentElement.dataset.tema === 'claro' ? 'escuro' : 'claro');

// aviso no canto da tela (entrou/saiu)
function toast(texto, tipo) {
  const t = document.createElement('div');
  t.className = 'toast ' + (tipo || '');
  t.textContent = texto;
  toasts.appendChild(t);
  setTimeout(() => t.remove(), 3300);
}

function criarBotao(texto, classe) {
  const b = document.createElement('button');
  if (classe) b.className = classe;
  b.textContent = texto;
  return b;
}
function criarRange(valor, largura) {
  const r = document.createElement('input');
  r.type = 'range';
  r.min = 0; r.max = 100; r.value = valor;
  if (largura) r.style.width = largura;
  return r;
}

// foto: corta no centro, reduz pra 96x96 e vira um JPEG pequeno (~4 KB)
function reduzirFoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const lado = Math.min(img.width, img.height);
      const sx = (img.width - lado) / 2, sy = (img.height - lado) / 2;
      const c = document.createElement('canvas');
      c.width = c.height = 96;
      c.getContext('2d').drawImage(img, sx, sy, lado, lado, 0, 0, 96, 96);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagem inválida')); };
    img.src = url;
  });
}

// só aceita foto pequena em JPEG (não se confia em qualquer coisa que chega pela rede)
function fotoValida(f) {
  return typeof f === 'string' && f.length < 30000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(f);
}

// cada nome ganha sempre a mesma cor, escolhida de uma paleta fixa (igual no PC de todo mundo)
const CORES_NOME = ['#e5534b', '#f0883e', '#d4a72c', '#2ea043', '#14b8a6', '#2f9de4', '#5865f2', '#a371f7', '#ec6cb9', '#a0705a'];
function corNome(nome) {
  const t = String(nome || '').trim().toLowerCase(); // maiúsculas/minúsculas não mudam a cor
  let h = 0;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return CORES_NOME[h % CORES_NOME.length];
}

function criarAvatar(nome, foto) {
  if (fotoValida(foto)) {
    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = foto;
    return img;
  }
  const d = document.createElement('div');
  d.className = 'avatar letra';
  d.textContent = (nome || '?').trim().charAt(0).toUpperCase() || '?';
  d.style.background = corNome(nome);
  return d;
}

// linha da lista de pessoas (criada uma vez e só atualizada depois, pra animação tocar só na entrada)
function criarLinha() {
  const el = document.createElement('div');
  el.className = 'pessoa';
  const avatarEl = document.createElement('div');
  const info = document.createElement('div');
  const nomeEl = document.createElement('div');
  const estadoEl = document.createElement('div');
  estadoEl.className = 'estado';
  info.append(nomeEl, estadoEl);
  el.append(avatarEl, info);
  return { el: el, avatarEl: avatarEl, nomeEl: nomeEl, estadoEl: estadoEl, chave: null, btn: null };
}
function atualizarLinha(l, nome, foto, e, base) {
  base = base || nome; // nome usado pra cor e letra (sem o "(você)")
  const chave = nome + '|' + (foto || '');
  if (l.chave !== chave) {
    const novo = criarAvatar(base, foto);
    l.avatarEl.replaceWith(novo);
    l.avatarEl = novo;
    l.chave = chave;
  }
  l.nomeEl.textContent = nome; // textContent evita código malicioso nos nomes
  l.nomeEl.style.color = corNome(base);
  l.estadoEl.textContent = e.texto;
  l.estadoEl.className = 'estado ' + e.classe;
}

// formulário de nome + foto (usado por quem cria a sala e por quem entra)
function formPerfil(chave, textoBotao, idBotao, dica, rotuloSenha, rotuloDiscord) {
  const perfil = lerSalvo(chave, { nome: '', foto: null });

  ui.innerHTML = '<div id="preview"></div>' +
    '<input id="nome" placeholder="Seu nome" maxlength="20"><br>' +
    '<label class="btn-arquivo">Escolher foto (opcional)<input type="file" id="foto" accept="image/*" style="display:none"></label><br><br>' +
    (rotuloSenha ? '<input type="password" id="senha" placeholder="' + rotuloSenha + '" maxlength="30" autocomplete="off"><br><br>' : '') +
    (rotuloDiscord ? '<input id="discord" placeholder="' + rotuloDiscord + '" maxlength="150" autocomplete="off"><br><br>' : '') +
    '<button id="' + idBotao + '">' + textoBotao + '</button><br>' +
    '<small>' + dica + '</small>';

  const nomeEl = $('nome');
  const prev = $('preview');
  nomeEl.value = perfil.nome || '';

  function mostrarPreview() {
    prev.innerHTML = '';
    if (fotoValida(perfil.foto)) prev.appendChild(criarAvatar('', perfil.foto));
  }
  mostrarPreview();

  $('foto').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    reduzirFoto(f).then(d => { perfil.foto = d; mostrarPreview(); })
                  .catch(() => alert('Não consegui abrir essa imagem.'));
  };

  // chamada quando o botão é clicado: pega o nome, salva e devolve o perfil
  return function confirmar(nomePadrao) {
    perfil.nome = nomeEl.value.trim() || nomePadrao;
    gravarSalvo(chave, perfil); // lembra nome e foto da próxima vez
    return perfil;
  };
}

// só aceita convite ou link de canal do próprio Discord (evita link malicioso)
function discordValido(l) {
  return typeof l === 'string' && l.length < 150 &&
    /^https:\/\/(discord\.gg\/[A-Za-z0-9-]{2,32}|(www\.)?discord\.com\/(invite\/[A-Za-z0-9-]{2,32}|channels\/\d{5,25}\/\d{5,25}))\/?$/.test(l);
}

function limitarBitrate(call) {
  setTimeout(() => {
    if (!call.peerConnection) return;
    call.peerConnection.getSenders().forEach(s => {
      if (s.track && s.track.kind === 'video') {
        const p = s.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = BITRATE;
        s.setParameters(p);
      }
    });
  }, 1000);
}

// ===== TELAS: um quadro de vídeo por pessoa que está transmitindo =====
const tiles = new Map(); // id -> { el, video, tag, limpar }
const vazioEl = document.createElement('div');
vazioEl.className = 'tela vazio-tela';
const vazioTxt = document.createElement('div');
vazioTxt.className = 'vazio-txt';
vazioEl.appendChild(vazioTxt);
telas.appendChild(vazioEl);
function setVazio(txt) { vazioTxt.textContent = txt; }
function atualizarVazio() { vazioEl.hidden = tiles.size > 0; }
setVazio('AGUARDANDO...');

function telaCheiaDe(elTela) {
  return (document.fullscreenElement || document.webkitFullscreenElement) === elTela;
}
function alternarTelaCheia(elTela, video) {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  let r;
  if (elTela.requestFullscreen) r = elTela.requestFullscreen();
  else if (elTela.webkitRequestFullscreen) r = elTela.webkitRequestFullscreen();
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iPhone
  if (r && r.catch) r.catch(() => {});
}

function addTile(id, nome, foto, stream, souEu) {
  const ex = tiles.get(id);
  if (ex) { if (ex.video.srcObject !== stream) ex.video.srcObject = stream; return; }

  const el = document.createElement('div');
  el.className = 'tile';

  const tela = document.createElement('div');
  tela.className = 'tela';
  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.muted = !!souEu; // a sua própria tela fica muda aqui (evita eco)
  video.srcObject = stream;
  tela.appendChild(video);
  const ov = document.createElement('div');
  ov.className = 'ov-tela';
  tela.appendChild(ov);

  const barra = document.createElement('div');
  barra.className = 'tile-barra';
  const quem = document.createElement('div');
  quem.className = 'tile-quem';
  const nomeEl = document.createElement('strong');
  nomeEl.textContent = nome + (souEu ? ' (você)' : '');
  nomeEl.style.color = corNome(nome);
  const tag = document.createElement('span');
  tag.className = 'tile-tag';
  quem.append(criarAvatar(nome, foto), nomeEl, tag);
  const ctl = document.createElement('div');
  ctl.className = 'tile-ctl';
  barra.append(quem, ctl);
  el.append(tela, barra);

  // controles: mutar e volume (só nas telas dos outros) e tela cheia
  const bTela = criarBotao('Tela cheia', 'sec');
  const ovTela = criarBotao('Sair da tela cheia', 'sec');
  let bMudo = null, ovMudo = null, vol = null, ovVol = null;
  function atualizarMudo() {
    const t = video.muted ? 'Ativar som' : 'Mutar';
    if (bMudo) { bMudo.textContent = t; ovMudo.textContent = t; }
  }
  if (!souEu) {
    bMudo = criarBotao('Mutar', 'sec');
    ovMudo = criarBotao('Mutar', 'sec');
    vol = criarRange(100, '80px');
    ovVol = criarRange(100, '130px');
    const alternarMudo = () => { video.muted = !video.muted; atualizarMudo(); };
    const ajustar = v => { video.volume = v / 100; vol.value = v; ovVol.value = v; };
    bMudo.onclick = ovMudo.onclick = alternarMudo;
    vol.oninput = e => ajustar(e.target.value);
    ovVol.oninput = e => ajustar(e.target.value);
    ctl.append(bMudo, vol);
    ov.append(ovMudo, ovVol);
  }
  ctl.append(bTela);
  ov.append(ovTela);

  const alternar = () => alternarTelaCheia(tela, video);
  bTela.onclick = ovTela.onclick = alternar;
  video.ondblclick = alternar;

  // os controles por cima do vídeo somem sozinhos depois de 3s sem mexer o mouse
  let tOv;
  function mostrarOverlay() {
    ov.classList.remove('oculto');
    tela.classList.remove('parado');
    clearTimeout(tOv);
    tOv = setTimeout(() => {
      if (telaCheiaDe(tela)) { ov.classList.add('oculto'); tela.classList.add('parado'); }
    }, 3000);
  }
  function aoMudarTelaCheia() {
    const ativa = telaCheiaDe(tela);
    bTela.textContent = ativa ? 'Sair da tela cheia' : 'Tela cheia';
    if (ativa) mostrarOverlay();
    else { clearTimeout(tOv); ov.classList.remove('oculto'); tela.classList.remove('parado'); }
  }
  document.addEventListener('fullscreenchange', aoMudarTelaCheia);
  document.addEventListener('webkitfullscreenchange', aoMudarTelaCheia);
  tela.addEventListener('mousemove', mostrarOverlay);
  tela.addEventListener('touchstart', mostrarOverlay);

  if (!souEu) {
    // se o navegador bloquear o som automático, toca sem som (a pessoa liga depois)
    const p = video.play();
    if (p && p.catch) p.catch(() => { video.muted = true; atualizarMudo(); video.play().catch(() => {}); });
    // transmissão ao vivo não faz sentido pausada: se pausar, volta a tocar
    video.addEventListener('pause', () => { if (video.srcObject) video.play().catch(() => {}); });
  }

  telas.insertBefore(el, vazioEl);
  tiles.set(id, {
    el: el, video: video, tag: tag,
    limpar: () => {
      clearTimeout(tOv);
      document.removeEventListener('fullscreenchange', aoMudarTelaCheia);
      document.removeEventListener('webkitfullscreenchange', aoMudarTelaCheia);
      if (telaCheiaDe(tela)) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
    }
  });
  atualizarVazio();
}

function removeTile(id) {
  const t = tiles.get(id);
  if (!t) return;
  t.limpar();
  t.video.srcObject = null;
  t.el.remove();
  tiles.delete(id);
  atualizarVazio();
}

function setTileMudo(id, mudo) {
  const t = tiles.get(id);
  if (t) t.tag.textContent = mudo ? 'sem áudio' : '';
}

// ===== SONS DE AVISO (entrou/saiu), configuráveis por quem está usando =====
function criarSons() {
  let audioCtx = null;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  let somLigado = true;
  let cfgAberto = true;

  // fonte: 'bipe', 'p0'...'p4' (sons prontos) ou 'custom' (arquivo escolhido do PC)
  const config = lerSalvo('syt-sons', {
    entrou: { fonte: 'p0', custom: null },
    saiu:   { fonte: 'p3', custom: null },
    volume: 0.6
  });

  function salvarConfig() {
    if (!gravarSalvo('syt-sons', config)) {
      alert('Não deu pra salvar pra próxima vez (arquivo grande demais pro navegador), mas vale nesta sessão.');
    }
  }

  function beep(freq) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.value = 0.15;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  // toca o som configurado pro evento ('entrou' ou 'saiu'); forcar = ignora o "mudo" (botão de teste)
  function tocar(ev, forcar) {
    if (!somLigado && !forcar) return;
    const reserva = ev === 'entrou' ? 880 : 440;
    const c = config[ev];
    let src = null;
    if (c.fonte === 'custom' && c.custom) src = c.custom.data;
    else if (/^p\d+$/.test(c.fonte) && SONS_PRONTOS[+c.fonte.slice(1)]) src = SONS_PRONTOS[+c.fonte.slice(1)].arquivo;
    if (!src) { beep(reserva); return; }
    const a = new Audio(src);
    a.volume = config.volume;
    a.play().catch(() => beep(reserva)); // se der erro (arquivo não encontrado etc.), toca o bipe
  }

  function escolherArquivo(ev, file) {
    if (!file) return;
    if (file.size > TAMANHO_MAX_SOM) {
      alert('Arquivo grande demais (máximo ~1 MB). Use um som curto.');
      return;
    }
    const r = new FileReader();
    r.onload = () => {
      config[ev].custom = { nome: file.name, data: r.result };
      config[ev].fonte = 'custom';
      salvarConfig();
      desenharConfig();
    };
    r.readAsDataURL(file);
  }

  function desenharConfig() {
    cfgBox.innerHTML = '';
    const det = document.createElement('details');
    det.open = cfgAberto;
    det.ontoggle = () => { cfgAberto = det.open; };
    const sum = document.createElement('summary');
    sum.textContent = 'Configurar sons';
    det.appendChild(sum);

    const linhaLiga = document.createElement('div');
    linhaLiga.className = 'cfg-linha';
    const lbl = document.createElement('label');
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = somLigado;
    chk.onchange = () => { somLigado = chk.checked; };
    lbl.append(chk, document.createTextNode('Som quando alguém entrar/sair'));
    linhaLiga.appendChild(lbl);
    det.appendChild(linhaLiga);

    [['entrou', 'Quando alguém entra'], ['saiu', 'Quando alguém sai']].forEach(([ev, rotulo]) => {
      const linha = document.createElement('div');
      linha.className = 'cfg-linha';
      const lab = document.createElement('div');
      lab.textContent = rotulo;

      const sel = document.createElement('select');
      const ops = [['bipe', 'Bipe simples']];
      SONS_PRONTOS.forEach((s, i) => ops.push(['p' + i, s.nome]));
      if (config[ev].custom) ops.push(['custom', 'Arquivo: ' + config[ev].custom.nome]);
      ops.forEach(([valor, texto]) => {
        const o = document.createElement('option');
        o.value = valor;
        o.textContent = texto;
        sel.appendChild(o);
      });
      sel.value = config[ev].fonte;
      sel.onchange = () => { config[ev].fonte = sel.value; salvarConfig(); };

      const arq = document.createElement('label');
      arq.className = 'btn-arquivo';
      arq.textContent = 'Escolher arquivo';
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'audio/*';
      inp.style.display = 'none';
      inp.onchange = () => escolherArquivo(ev, inp.files[0]);
      arq.appendChild(inp);

      const teste = criarBotao('Testar', 'sec');
      teste.onclick = () => tocar(ev, true);

      linha.append(lab, sel, document.createTextNode(' '), arq, document.createTextNode(' '), teste);
      det.appendChild(linha);
    });

    const vl = document.createElement('div');
    vl.className = 'cfg-linha';
    vl.appendChild(document.createTextNode('Volume: '));
    const rng = criarRange(Math.round(config.volume * 100), '60%');
    rng.onchange = () => { config.volume = rng.value / 100; salvarConfig(); };
    vl.appendChild(rng);
    det.appendChild(vl);

    const rest = criarBotao('Restaurar padrão', 'sec');
    rest.onclick = () => {
      config.entrou = { fonte: 'p0', custom: null };
      config.saiu = { fonte: 'p3', custom: null };
      config.volume = 0.6;
      salvarConfig();
      desenharConfig();
    };
    det.appendChild(rest);

    cfgBox.appendChild(det);
  }

  return { tocar: tocar, desenharConfig: desenharConfig };
}

// só aceita desenho pequeno em PNG/JPEG
function imgValida(s) {
  return typeof s === 'string' && s.length < 100000 && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(s);
}

// monta o chat dentro de #chat. enviar(obj) manda { texto } ou { img }. Devolve { receber(msg) }.
function montarChat(enviar) {
  chatBox.innerHTML = '';

  const titulo = document.createElement('div');
  titulo.className = 'titulo';
  titulo.textContent = 'Chat';

  const msgs = document.createElement('div');
  msgs.id = 'msgs';

  // linha de texto
  const form = document.createElement('div');
  form.className = 'chat-form';
  const inp = document.createElement('input');
  inp.placeholder = 'Mensagem...';
  inp.maxLength = 200;
  const bEnviar = criarBotao('Enviar');
  const bDesenhar = criarBotao('Desenhar', 'sec');
  form.append(inp, bEnviar, bDesenhar);

  function enviarTexto() {
    const t = inp.value.trim();
    if (!t) return;
    enviar({ texto: t.slice(0, 200) });
    inp.value = '';
  }
  bEnviar.onclick = enviarTexto;
  inp.onkeydown = e => { if (e.key === 'Enter') enviarTexto(); };

  // quadro de desenho
  const pad = document.createElement('div');
  pad.className = 'pad';
  pad.hidden = true;
  const cv = document.createElement('canvas');
  cv.width = 320;
  cv.height = 200;
  const ctx = cv.getContext('2d');
  function limpar() { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height); }
  limpar();

  let cor = '#111214', tam = 5, desenhando = false, ultimo = null;

  function pos(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
  }
  function ponto(p) {
    ctx.fillStyle = cor;
    ctx.beginPath();
    ctx.arc(p.x, p.y, tam / 2, 0, Math.PI * 2);
    ctx.fill();
  }
  cv.onpointerdown = e => {
    desenhando = true;
    cv.setPointerCapture(e.pointerId);
    ultimo = pos(e);
    ponto(ultimo);
  };
  cv.onpointermove = e => {
    if (!desenhando) return;
    const p = pos(e);
    ctx.strokeStyle = cor;
    ctx.lineWidth = tam;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ultimo.x, ultimo.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ultimo = p;
  };
  cv.onpointerup = cv.onpointercancel = () => { desenhando = false; };

  // ferramentas: cores (a branca é a borracha), tamanhos, limpar, enviar
  const ferr = document.createElement('div');
  ferr.className = 'pad-ferr';
  const CORES = ['#111214', '#ed4245', '#faa61a', '#fee75c', '#3ba55d', '#5865f2', '#eb459e', '#ffffff'];
  const botoesCor = [];
  CORES.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'cor' + (i === 0 ? ' sel' : '');
    b.style.background = c;
    b.title = c === '#ffffff' ? 'Borracha' : 'Cor';
    b.onclick = () => {
      cor = c;
      botoesCor.forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
    };
    botoesCor.push(b);
    ferr.appendChild(b);
  });
  const botoesTam = [];
  [['P', 2], ['M', 5], ['G', 12]].forEach(([rotulo, t]) => {
    const b = criarBotao(rotulo, 'sec' + (t === 5 ? ' sel' : ''));
    b.onclick = () => {
      tam = t;
      botoesTam.forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
    };
    botoesTam.push(b);
    ferr.appendChild(b);
  });
  const bLimpar = criarBotao('Limpar', 'sec');
  bLimpar.onclick = limpar;
  const bEnvDes = criarBotao('Enviar desenho');
  bEnvDes.onclick = () => {
    let img = cv.toDataURL('image/png');
    if (!imgValida(img)) img = cv.toDataURL('image/jpeg', 0.6); // se o PNG ficou pesado, tenta JPEG
    if (!imgValida(img)) { alert('Desenho complexo demais. Tente algo mais simples.'); return; }
    enviar({ img: img });
    limpar();
    pad.hidden = true;
  };
  ferr.append(bLimpar, bEnvDes);
  pad.append(cv, ferr);
  bDesenhar.onclick = () => { pad.hidden = !pad.hidden; };

  chatBox.append(titulo, msgs, form, pad);

  // mostra uma mensagem recebida (valida tudo, porque vem da rede)
  function receber(m) {
    if (!m) return;
    const el = document.createElement('div');
    el.className = 'msg';
    if (m.sistema) {
      el.classList.add('sistema');
      el.textContent = String(m.texto || '').slice(0, 100);
    } else {
      const nome = String(m.nome || 'Alguém').slice(0, 20);
      const q = document.createElement('span');
      q.className = 'quem';
      q.textContent = nome + ':';
      q.style.color = corNome(nome);
      el.appendChild(q);
      if (typeof m.texto === 'string' && m.texto) {
        el.appendChild(document.createTextNode(m.texto.slice(0, 200))); // texto puro, sem HTML
      } else if (imgValida(m.img)) {
        const im = document.createElement('img');
        im.className = 'desenho';
        im.onload = () => { msgs.scrollTop = msgs.scrollHeight; };
        im.src = m.img;
        el.appendChild(im);
      } else {
        return;
      }
    }
    msgs.appendChild(el);
    while (msgs.children.length > 100) msgs.firstChild.remove();
    msgs.scrollTop = msgs.scrollHeight;
  }

  return { receber: receber };
}

// ===== MÚSICA (YouTube, ouvir junto) =====
const REGEX_YT_ID = /^[A-Za-z0-9_-]{11}$/;

// tira o ID do vídeo de um link do YouTube (youtube.com, youtu.be, music.youtube.com, shorts)
function ytId(link) {
  let u;
  try { u = new URL(String(link).trim()); } catch (e) { return null; }
  const h = u.hostname.replace(/^www\./, '');
  let id = null;
  if (h === 'youtu.be') {
    id = u.pathname.slice(1).split('/')[0];
  } else if (h === 'youtube.com' || h === 'm.youtube.com' || h === 'music.youtube.com') {
    if (u.pathname === '/watch') {
      id = u.searchParams.get('v');
    } else {
      const m = u.pathname.match(/^\/(shorts|embed|live)\/([^\/]+)/);
      if (m) id = m[2];
    }
  }
  return id && REGEX_YT_ID.test(id) ? id : null;
}

// carrega o player do YouTube só quando precisa
let ytPromessa = null;
function carregarYT() {
  if (ytPromessa) return ytPromessa;
  ytPromessa = new Promise(resolve => {
    if (window.YT && window.YT.Player) { resolve(); return; }
    window.onYouTubeIframeAPIReady = resolve;
    const sc = document.createElement('script');
    sc.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(sc);
  });
  return ytPromessa;
}

// quem controla a música: tem o campo do link, o player com controles e manda o estado pra todo mundo
function montarMusicaControle(enviar, inicial) {
  const titulo = document.createElement('div');
  titulo.className = 'titulo';
  titulo.textContent = 'Música (você controla)';

  const linha = document.createElement('div');
  linha.className = 'chat-form';
  const inp = document.createElement('input');
  inp.placeholder = 'Cole o link do YouTube';
  inp.maxLength = 200;
  const bTocar = criarBotao('Tocar');
  const bParar = criarBotao('Parar', 'sec');
  linha.append(inp, bTocar, bParar);

  const wrap = document.createElement('div');
  wrap.className = 'yt-wrap';
  wrap.hidden = true;
  wrap.innerHTML = '<div id="ytplayer"></div>';

  const dica = document.createElement('small');
  dica.textContent = 'Todo mundo ouve junto com você. Se estiver compartilhando o áudio do sistema, mute o áudio da sua transmissão pra ninguém ouvir em dobro.';

  musicaBox.append(titulo, linha, wrap, dica);

  let player = null, idAtual = null, tocando = false, destruido = false;

  function estado() {
    let t = 0;
    try { if (player && player.getCurrentTime) t = player.getCurrentTime() || 0; } catch (e) {}
    return { tipo: 'yt', id: idAtual, t: t, tocando: tocando };
  }
  function enviarEstado() { enviar(estado()); }

  function aoMudar(e) {
    const st = e.data;
    if (st === 1) tocando = true;                      // tocando
    else if (st === 2 || st === 0) tocando = false;    // pausado ou terminou
    else return;
    enviarEstado();
  }

  function tocarLink() {
    const id = ytId(inp.value);
    if (!id) { alert('Link do YouTube inválido. Cole o link de um vídeo.'); return; }
    carregarYT().then(() => {
      if (destruido) return;
      wrap.hidden = false;
      idAtual = id;
      tocando = true;
      if (!player) {
        player = new YT.Player('ytplayer', {
          width: '100%', height: '180', videoId: id,
          playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
          events: { onReady: e => e.target.playVideo(), onStateChange: aoMudar }
        });
      } else {
        player.loadVideoById(id);
      }
      enviarEstado();
    });
  }

  function pararMusica() {
    if (player) { try { player.destroy(); } catch (e) {} player = null; }
    idAtual = null;
    tocando = false;
    wrap.hidden = true;
    wrap.innerHTML = '<div id="ytplayer"></div>';
    enviarEstado();
  }

  bTocar.onclick = tocarLink;
  inp.onkeydown = e => { if (e.key === 'Enter') tocarLink(); };
  bParar.onclick = pararMusica;

  // se virou controlador com uma música já tocando, continua de onde estava
  if (inicial && inicial.id) {
    const t0 = inicial.tocando ? inicial.t + (Date.now() - inicial.quando) / 1000 : inicial.t;
    carregarYT().then(() => {
      if (destruido) return;
      wrap.hidden = false;
      idAtual = inicial.id;
      tocando = inicial.tocando;
      player = new YT.Player('ytplayer', {
        width: '100%', height: '180', videoId: inicial.id,
        playerVars: { autoplay: inicial.tocando ? 1 : 0, playsinline: 1, rel: 0, start: Math.floor(t0) },
        events: { onReady: e => { if (inicial.tocando) e.target.playVideo(); }, onStateChange: aoMudar }
      });
    });
  }

  // a cada 4s manda o tempo atual, assim quem ficou pra trás (ou você pulou a música) se acerta sozinho
  const tick = setInterval(() => { if (idAtual) enviarEstado(); }, 4000);

  return {
    estado: estado,
    receber: () => {},
    destruir: () => {
      destruido = true;
      clearInterval(tick);
      if (player) { try { player.destroy(); } catch (e) {} player = null; }
    }
  };
}

// todo o resto da sala: segue quem controla (não dá pra pausar nem trocar de vídeo)
function montarMusicaSeguir(inicial) {
  const titulo = document.createElement('div');
  titulo.className = 'titulo';
  titulo.textContent = 'Música (YouTube)';
  const status = document.createElement('div');
  status.style.color = 'var(--suave)';
  status.textContent = 'Nenhuma música tocando.';

  const wrap = document.createElement('div');
  wrap.className = 'yt-wrap';
  wrap.hidden = true;
  function recriarAlvo() { wrap.innerHTML = '<div id="ytplayerv"></div><div class="yt-bloqueio"></div>'; }
  recriarAlvo();

  const ctl = document.createElement('div');
  ctl.className = 'musica-ctl';
  ctl.hidden = true;
  const bSinc = criarBotao('Sincronizar');
  const bMudo = criarBotao('Mutar música', 'sec');
  const vol = criarRange(100, '90px');
  ctl.append(bSinc, bMudo, vol);

  const dica = document.createElement('small');
  dica.textContent = 'Quem está transmitindo controla a música. Se ninguém transmite, é o dono da sala.';

  musicaBox.append(titulo, status, wrap, ctl, dica);

  let player = null, pronto = false, idAtual = null, ultimo = null, destruido = false;

  // onde o controlador deve estar agora (o tempo que ele mandou + o que passou desde então)
  function tempoAtual() {
    return ultimo.tocando ? ultimo.t + (Date.now() - ultimo.quando) / 1000 : ultimo.t;
  }

  function limpar() {
    if (player) { try { player.destroy(); } catch (e) {} }
    player = null; pronto = false; idAtual = null;
    recriarAlvo();
    wrap.hidden = true;
    ctl.hidden = true;
    status.textContent = 'Nenhuma música tocando.';
  }

  function ajustar() {
    if (!player || !pronto || !ultimo || !ultimo.id) return;
    if (ultimo.id !== idAtual) { // trocou de vídeo
      idAtual = ultimo.id;
      if (ultimo.tocando) player.loadVideoById({ videoId: ultimo.id, startSeconds: tempoAtual() });
      else player.cueVideoById({ videoId: ultimo.id, startSeconds: ultimo.t });
      return;
    }
    const st = player.getPlayerState();
    const alvo = tempoAtual();
    if (Math.abs(player.getCurrentTime() - alvo) > 2.5) player.seekTo(alvo, true);
    if (ultimo.tocando && st !== 1 && st !== 3) player.playVideo();
    if (!ultimo.tocando && st === 1) player.pauseVideo();
  }

  function aplicar() {
    if (!ultimo) return;
    if (!ultimo.id) { limpar(); return; }
    wrap.hidden = false;
    ctl.hidden = false;
    status.textContent = ultimo.tocando ? 'Tocando junto com a sala.' : 'Pausado.';
    carregarYT().then(() => {
      if (destruido || !ultimo || !ultimo.id) return;
      if (!player) {
        idAtual = ultimo.id;
        player = new YT.Player('ytplayerv', {
          width: '100%', height: '180', videoId: ultimo.id,
          playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, autoplay: ultimo.tocando ? 1 : 0, start: Math.floor(tempoAtual()) },
          events: { onReady: () => { pronto = true; ajustar(); } }
        });
        return;
      }
      ajustar();
    });
  }

  // recebe um estado já conferido: { id, t, tocando, quando }
  function receber(est) {
    ultimo = est;
    aplicar();
  }

  // se o navegador bloqueou o som automático, esse botão (um clique seu) libera e acerta o tempo
  bSinc.onclick = () => {
    if (!player || !pronto || !ultimo || !ultimo.id) return;
    player.seekTo(tempoAtual(), true);
    if (ultimo.tocando) player.playVideo();
  };
  bMudo.onclick = () => {
    if (!player || !pronto) return;
    if (player.isMuted()) { player.unMute(); bMudo.textContent = 'Mutar música'; }
    else { player.mute(); bMudo.textContent = 'Ativar música'; }
  };
  vol.oninput = () => { if (player && pronto) player.setVolume(+vol.value); };

  if (inicial && inicial.id) receber(inicial);

  return {
    receber: receber,
    destruir: () => {
      destruido = true;
      if (player) { try { player.destroy(); } catch (e) {} }
      player = null;
    }
  };
}

// gerencia o cartão de música: quem controla vê o painel de controle, os outros só seguem
function criarMusica(enviar) {
  let atual = null, controla = null, ultimo = null; // ultimo: { id, t, tocando, quando }

  function normalizar(m) {
    const id = (m && typeof m.id === 'string' && REGEX_YT_ID.test(m.id)) ? m.id : null;
    const t = Math.max(0, Math.min(Number(m && m.t) || 0, 100000));
    return { id: id, t: t, tocando: !!(m && m.tocando), quando: Date.now() };
  }

  function montar(sou) {
    if (atual) {
      // se estava controlando, guarda onde parou pra continuar como seguidor
      if (controla) {
        const e = atual.estado();
        if (e.id) ultimo = { id: e.id, t: e.t, tocando: e.tocando, quando: Date.now() };
      }
      atual.destruir();
    }
    musicaBox.innerHTML = '';
    controla = sou;
    atual = sou ? montarMusicaControle(enviar, ultimo) : montarMusicaSeguir(ultimo);
  }

  return {
    receber(m) {
      ultimo = normalizar(m);
      if (atual && !controla) atual.receber(ultimo);
    },
    definirControlador(sou) {
      sou = !!sou;
      if (atual && controla === sou) return;
      montar(sou);
    },
    destruir() {
      if (atual) atual.destruir();
      atual = null;
      musicaBox.innerHTML = '';
    }
  };
}

// ===== A SALA =====
// Quem cria a sala (o "dono") coordena tudo: senha, lista de pessoas, chat, quem está transmitindo.
// Cada pessoa que transmite manda a própria tela direto pras outras.
function iniciarSala(op) {
  const souDono = !!op.souDono;
  const perfil = op.perfil;
  const eu = { id: null, nome: perfil.nome, foto: fotoValida(perfil.foto) ? perfil.foto : null };
  const sons = criarSons();
  const peer = new Peer();
  const podeCapturar = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);

  let conn = null;              // conexão com o dono (quando você não é o dono)
  let encerrado = false;
  let minhaTx = null;           // { stream, calls, mudo } quando você está transmitindo
  let chat = null;
  let dono = null;
  let controladorMusica = null; // quem controla a música agora
  let statusTimer = null, hubTimer = null, prazoEntrada = null, entrou = false;

  const pessoas = new Map();       // id -> { nome, foto, cod }  (cod: 0 ok, 1 aba em 2º plano, 2 sem sinal)
  const transmissores = new Map(); // id -> { nome, mudo }
  const pendentes = new Map();     // chamadas que chegaram antes do aviso do dono
  const musica = criarMusica(msg => enviarAoHub(msg));

  // elementos da lista de pessoas e dos botões
  let painelPronto = false, contador = null, lista = null;
  const linhas = new Map();
  let bTx = null, bMudoTx = null, infoEl = null;
  const abas = { chat: chatBox, pessoas: painel, musica: musicaBox, sons: cfgBox };
  const botoesAba = {};
  let abaAtual = 'chat', naoLidas = 0;

  // ---------- falar com o dono ----------
  function enviarAoHub(msg) {
    if (encerrado) return;
    if (souDono) { if (eu.id) hubReceber(eu.id, msg); }
    else if (conn && conn.open) { try { conn.send(msg); } catch (e) {} }
  }

  // ---------- encerrar ----------
  function sair(msg) {
    if (encerrado) return;
    encerrado = true;
    clearInterval(statusTimer);
    clearInterval(hubTimer);
    clearTimeout(prazoEntrada);
    if (minhaTx) {
      minhaTx.calls.forEach(c => { try { c.close(); } catch (e) {} });
      minhaTx.stream.getTracks().forEach(t => t.stop());
      minhaTx = null;
    }
    pendentes.forEach(c => { try { c.close(); } catch (e) {} });
    [...tiles.keys()].forEach(removeTile);
    try { peer.destroy(); } catch (e) {}
    musica.destruir();
    chatBox.innerHTML = '';
    painel.innerHTML = '';
    cfgBox.innerHTML = '';
    $('abas').innerHTML = '';
    Object.keys(abas).forEach(k => { abas[k].hidden = false; });
    lateral.hidden = true;
    app.classList.remove('com-lateral');
    setVazio('FIM');
    atualizarVazio();
    ui.className = '';
    ui.innerHTML = msg + '<br><button onclick="location.reload()">' + (souDono ? 'Criar nova sala' : 'Entrar de novo') + '</button>';
  }

  // ---------- interface da sala ----------
  function mostrarSalaInfo(d, discord) {
    if (!infoEl) return;
    infoEl.innerHTML = '';
    const t = document.createElement('span');
    t.textContent = 'Sala de:';
    const n = document.createElement('strong');
    n.textContent = String(d.nome || 'Anônimo').slice(0, 20);
    n.style.color = corNome(n.textContent);
    infoEl.append(t, criarAvatar(n.textContent, fotoValida(d.foto) ? d.foto : null), n);
    if (discordValido(discord)) { // botão pra entrar na call do Discord
      const a = document.createElement('a');
      a.className = 'btn-link';
      a.href = discord;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = 'Entrar na call do Discord';
      infoEl.appendChild(a);
    }
  }

  // copia o link da sala (só o dono tem o botão "Convidar")
  function copiarLink() {
    const link = location.href.split('#')[0] + '#' + peer.id;
    const ok = () => toast('Link da sala copiado!' + (op.senha ? ' Mande a senha também.' : ''), 'entrou');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(ok).catch(() => prompt('Copie o link da sala:', link));
    } else {
      prompt('Copie o link da sala:', link);
    }
  }

  function montarBarra() {
    ui.innerHTML = '';
    ui.className = 'sala';
    infoEl = document.createElement('div');
    infoEl.className = 'sala-info';
    const linha = document.createElement('div');
    linha.className = 'controles';
    bTx = criarBotao('Transmitir minha tela');
    bMudoTx = criarBotao('Mutar meu áudio', 'sec');
    bMudoTx.hidden = true;
    linha.append(bTx, bMudoTx);
    if (souDono) {
      const bConvidar = criarBotao('Convidar', 'sec');
      bConvidar.onclick = copiarLink;
      linha.appendChild(bConvidar);
    }
    const bSair = criarBotao(souDono ? 'Encerrar sala' : 'Sair da sala', 'perigo');
    linha.appendChild(bSair);
    ui.append(infoEl, linha);

    bTx.onclick = () => { if (minhaTx) pararMinhaTx(true); else iniciarMinhaTx(); };
    bMudoTx.onclick = alternarMeuMudo;
    bSair.onclick = () => {
      if (souDono && !confirm('Encerrar a sala? Todo mundo será desconectado.')) return;
      sair(souDono ? 'Sala encerrada.' : 'Você saiu.');
    };
    atualizarBotoes();
  }

  function atualizarBotoes() {
    if (!bTx) return;
    if (!podeCapturar) {
      bTx.disabled = true;
      bTx.textContent = 'Transmitir (só no computador)';
    } else {
      bTx.textContent = minhaTx ? 'Parar minha transmissão' : 'Transmitir minha tela';
      bTx.className = minhaTx ? 'perigo' : '';
    }
    bMudoTx.hidden = !minhaTx;
    if (minhaTx) {
      const sem = !minhaTx.stream.getAudioTracks().length;
      bMudoTx.disabled = sem;
      bMudoTx.textContent = sem ? 'Sem áudio compartilhado' : (minhaTx.mudo ? 'Reativar meu áudio' : 'Mutar meu áudio');
    }
  }

  function montarPainel() {
    painel.innerHTML = '';
    const titulo = document.createElement('div');
    titulo.className = 'titulo';
    const tt = document.createElement('span');
    tt.textContent = 'Na sala';
    contador = document.createElement('span');
    contador.id = 'contador';
    titulo.append(tt, contador);
    lista = document.createElement('div');
    painel.append(titulo, lista);
    painelPronto = true;
  }

  function estadoDe(id, pp) {
    if (transmissores.has(id)) return { texto: 'transmitindo', classe: 'live' };
    if (pp.cod === 2) return { texto: 'sem sinal', classe: 'sem' };
    if (pp.cod === 1) return { texto: 'aba em segundo plano', classe: 'dorme' };
    return { texto: 'na sala', classe: 'ok' };
  }

  function painelRender() {
    if (!painelPronto || encerrado) return;
    atualizarAbas();
    const txt = pessoas.size + '/' + MAX_PESSOAS;
    if (contador.textContent !== txt) {
      contador.textContent = txt;
      contador.classList.remove('pulso');
      void contador.offsetWidth; // reinicia a animação
      contador.classList.add('pulso');
    }
    pessoas.forEach((pp, id) => {
      let l = linhas.get(id);
      if (!l) { // pessoa nova: cria a linha com animação de entrada
        l = criarLinha();
        l.el.classList.add('entra');
        if (souDono && id !== eu.id) { // o dono pode parar a transmissão de outra pessoa
          l.btn = criarBotao('Parar', 'sec');
          l.btn.hidden = true;
          l.btn.onclick = () => hubForcarParar(id);
          l.el.appendChild(l.btn);
        }
        lista.appendChild(l.el);
        linhas.set(id, l);
      }
      const nomeTxt = pp.nome + (id === eu.id ? ' (você)' : '') + (dono && id === dono.id ? ' (dono)' : '');
      atualizarLinha(l, nomeTxt, pp.foto, estadoDe(id, pp), pp.nome);
      if (l.btn) l.btn.hidden = !transmissores.has(id);
    });
    linhas.forEach((l, id) => { // pessoa saiu: animação de saída e remove
      if (!pessoas.has(id)) {
        l.el.classList.remove('entra');
        l.el.classList.add('sai');
        setTimeout(() => l.el.remove(), 450);
        linhas.delete(id);
      }
    });
  }

  // ---------- abas da coluna lateral (Chat / Pessoas / Música / Sons) ----------
  function montarAbas() {
    const barra = $('abas');
    barra.innerHTML = '';
    [['chat', 'Chat'], ['pessoas', 'Pessoas'], ['musica', 'Música'], ['sons', 'Sons']].forEach(([id, rotulo]) => {
      const b = criarBotao(rotulo, 'sec');
      b.onclick = () => abrirAba(id);
      botoesAba[id] = b;
      barra.appendChild(b);
    });
    abrirAba('chat');
  }

  function abrirAba(id) {
    abaAtual = id;
    if (id === 'chat') naoLidas = 0;
    Object.keys(abas).forEach(k => { abas[k].hidden = (k !== id); });
    atualizarAbas();
  }

  function atualizarAbas() {
    if (!botoesAba.chat) return;
    Object.keys(botoesAba).forEach(k => {
      if (k === abaAtual) botoesAba[k].classList.add('sel'); else botoesAba[k].classList.remove('sel');
    });
    botoesAba.chat.textContent = 'Chat' + (naoLidas ? ' (' + naoLidas + ')' : '');
    botoesAba.pessoas.textContent = 'Pessoas ' + pessoas.size + '/' + MAX_PESSOAS;
  }

  function montarSala() {
    lateral.hidden = false;
    app.classList.add('com-lateral');
    chat = montarChat(obj => enviarAoHub(Object.assign({ tipo: 'chat' }, obj)));
    montarPainel();
    sons.desenharConfig();
    montarBarra();
    montarAbas();
    setVazio('NINGUÉM TRANSMITINDO');
    atualizarVazio();
  }

  // ---------- transmitir a sua tela ----------
  async function iniciarMinhaTx() {
    if (minhaTx || encerrado) return;
    if (!podeCapturar) {
      alert('Este navegador não consegue compartilhar a tela (celulares não conseguem). Pra transmitir, use um computador. Pra assistir, o celular funciona.');
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
    } catch (e) {
      return; // cancelou a escolha da tela
    }
    if (encerrado) { stream.getTracks().forEach(t => t.stop()); return; }
    minhaTx = { stream: stream, calls: new Map(), mudo: false };
    // se você clicar em "Parar compartilhamento" na barra do navegador, também encerra
    stream.getVideoTracks()[0].onended = () => pararMinhaTx(true);
    addTile(eu.id, eu.nome, eu.foto, stream, true);
    atualizarBotoes();
    enviarAoHub({ tipo: 'tx-quero' });
  }

  function pararMinhaTx(avisar) {
    if (!minhaTx) return;
    const tx = minhaTx;
    minhaTx = null;
    tx.calls.forEach(c => { try { c.close(); } catch (e) {} });
    tx.stream.getTracks().forEach(t => t.stop());
    removeTile(eu.id);
    atualizarBotoes();
    if (avisar) enviarAoHub({ tipo: 'tx-parar' });
  }

  // liga/desliga o áudio da SUA transmissão pra todo mundo
  function alternarMeuMudo() {
    if (!minhaTx) return;
    const faixas = minhaTx.stream.getAudioTracks();
    if (!faixas.length) return;
    minhaTx.mudo = !minhaTx.mudo;
    faixas.forEach(t => { t.enabled = !minhaTx.mudo; });
    setTileMudo(eu.id, minhaTx.mudo);
    atualizarBotoes();
    enviarAoHub({ tipo: 'tx-mudo', mudo: minhaTx.mudo });
  }

  // manda a sua tela pra uma pessoa
  function ligarPara(id) {
    if (!minhaTx || id === eu.id || minhaTx.calls.has(id)) return;
    const call = peer.call(id, minhaTx.stream);
    limitarBitrate(call);
    minhaTx.calls.set(id, call);
    call.on('close', () => { if (minhaTx) minhaTx.calls.delete(id); });
  }

  // ---------- receber a tela de quem transmite ----------
  function aceitarChamada(call) {
    call.answer(); // não manda nada de volta, só recebe
    call.on('stream', s => {
      if (encerrado) return;
      const t = transmissores.get(call.peer);
      const pp = pessoas.get(call.peer);
      addTile(call.peer, t ? t.nome : (pp ? pp.nome : 'Alguém'), pp ? pp.foto : null, s, false);
      if (t && t.mudo) setTileMudo(call.peer, true);
    });
    call.on('close', () => removeTile(call.peer));
  }

  peer.on('call', call => {
    if (transmissores.has(call.peer)) { aceitarChamada(call); return; }
    // ainda não sabemos que essa pessoa transmite: espera o aviso do dono (até 8s)
    pendentes.set(call.peer, call);
    setTimeout(() => {
      if (pendentes.get(call.peer) === call) { pendentes.delete(call.peer); try { call.close(); } catch (e) {} }
    }, 8000);
  });

  // ---------- mensagens que chegam do dono ----------
  function aoReceberDoHub(d) {
    if (!d || encerrado) return;
    switch (d.tipo) {
      case 'entrada': {
        entrou = true;
        clearTimeout(prazoEntrada);
        eu.id = d.voce;
        dono = { id: d.dono.id, nome: String(d.dono.nome || 'Anônimo').slice(0, 20), foto: fotoValida(d.dono.foto) ? d.dono.foto : null };
        pessoas.clear();
        (d.participantes || []).forEach(x => {
          pessoas.set(x.id, { nome: String(x.nome || 'Alguém').slice(0, 20), foto: fotoValida(x.foto) ? x.foto : null, cod: 0 });
        });
        transmissores.clear();
        (d.transmissoes || []).forEach(x => {
          transmissores.set(x.id, { nome: String(x.nome || 'Alguém').slice(0, 20), mudo: !!x.mudo });
        });
        controladorMusica = d.controlador || null;
        montarSala();
        mostrarSalaInfo(dono, d.discord);
        painelRender();
        if (d.musica) musica.receber(d.musica);
        musica.definirControlador(controladorMusica === eu.id);
        break;
      }
      case 'p-entrou': {
        const nome = String(d.nome || 'Alguém').slice(0, 20);
        pessoas.set(d.id, { nome: nome, foto: fotoValida(d.foto) ? d.foto : null, cod: 0 });
        sons.tocar('entrou');
        toast(nome + ' entrou', 'entrou');
        painelRender();
        break;
      }
      case 'p-saiu': {
        const pp = pessoas.get(d.id);
        pessoas.delete(d.id);
        transmissores.delete(d.id);
        if (d.id !== eu.id) removeTile(d.id);
        const c = pendentes.get(d.id);
        if (c) { pendentes.delete(d.id); try { c.close(); } catch (e) {} }
        if (pp) { sons.tocar('saiu'); toast(pp.nome + ' saiu', 'saiu'); }
        painelRender();
        break;
      }
      case 'estados': {
        const e = d.e || {};
        pessoas.forEach((pp, id) => { if (typeof e[id] === 'number') pp.cod = e[id]; });
        painelRender();
        break;
      }
      case 'msg':
        if (chat) chat.receber(d);
        if (abaAtual !== 'chat' && !d.sistema) { naoLidas++; atualizarAbas(); } // mostra "Chat (2)" na aba
        break;
      case 'tx-inicio': {
        transmissores.set(d.id, { nome: String(d.nome || 'Alguém').slice(0, 20), mudo: false });
        const c = pendentes.get(d.id);
        if (c) { pendentes.delete(d.id); aceitarChamada(c); }
        painelRender();
        break;
      }
      case 'tx-fim':
        transmissores.delete(d.id);
        if (d.id === eu.id) { if (minhaTx) pararMinhaTx(false); }
        else removeTile(d.id);
        painelRender();
        break;
      case 'tx-mudo': {
        const t = transmissores.get(d.id);
        if (t) t.mudo = !!d.mudo;
        setTileMudo(d.id, !!d.mudo);
        break;
      }
      case 'tx-ok': // o dono liberou: manda a sua tela pra todo mundo que já está na sala
        (d.alvos || []).forEach(ligarPara);
        break;
      case 'tx-negado':
        alert(String(d.motivo || 'Não foi possível transmitir agora.'));
        pararMinhaTx(false);
        break;
      case 'chamar': // alguém novo entrou na sala: manda a sua tela pra ele também
        if (minhaTx) ligarPara(d.id);
        break;
      case 'tx-forcar-parar':
        if (minhaTx) { toast('O dono parou a sua transmissão', 'saiu'); pararMinhaTx(true); }
        break;
      case 'musica-dono':
        controladorMusica = d.id || null;
        if (controladorMusica === eu.id) toast('Você controla a música agora (aba Música)', 'entrou');
        musica.definirControlador(controladorMusica === eu.id);
        break;
      case 'yt':
        musica.receber(d);
        break;
    }
  }

  // =====================================================
  // ===== SÓ O DONO: coordena a sala =====
  // =====================================================
  const participantes = new Map();    // id -> { conn, nome, foto, visivel, ultimo, ultimaMsg }
  const transmissoesHub = new Map();  // id -> { nome, mudo, desde }
  let musicaEstado = null;            // último estado da música (pra quem entra depois)

  function enviarPara(id, msg) {
    const p = participantes.get(id);
    if (!p) return;
    if (id === eu.id) aoReceberDoHub(msg); // o dono recebe direto, sem rede
    else { try { p.conn.send(msg); } catch (e) {} }
  }

  function difundir(msg, exceto) {
    [...participantes.keys()].forEach(id => { if (id !== exceto) enviarPara(id, msg); });
  }

  function listaPessoas() {
    return [...participantes].map(([id, p]) => ({ id: id, nome: p.nome, foto: p.foto }));
  }

  function hubEntrar(c, d) {
    const id = c.peer;
    const p = {
      conn: c,
      nome: String(d.nome || 'Alguém').slice(0, 20),
      foto: fotoValida(d.foto) ? d.foto : null,
      visivel: true, ultimo: Date.now(), ultimaMsg: 0
    };
    participantes.set(id, p);
    enviarPara(id, {
      tipo: 'entrada', voce: id,
      dono: { id: eu.id, nome: eu.nome, foto: eu.foto },
      discord: op.discordLink || '',
      participantes: listaPessoas(),
      transmissoes: [...transmissoesHub].map(([tid, t]) => ({ id: tid, nome: t.nome, mudo: t.mudo })),
      controlador: controladorMusica,
      musica: musicaEstado
    });
    difundir({ tipo: 'p-entrou', id: id, nome: p.nome, foto: p.foto }, id);
    difundir({ tipo: 'msg', sistema: true, texto: p.nome + ' entrou' });
    // quem já está transmitindo manda a tela pra pessoa nova
    transmissoesHub.forEach((t, bid) => enviarPara(bid, { tipo: 'chamar', id: id }));
  }

  function hubSair(id) {
    const p = participantes.get(id);
    if (!p) return;
    participantes.delete(id);
    pararTxHub(id);
    difundir({ tipo: 'p-saiu', id: id });
    difundir({ tipo: 'msg', sistema: true, texto: p.nome + ' saiu' });
  }

  function pararTxHub(id) {
    if (!transmissoesHub.delete(id)) return;
    const p = participantes.get(id);
    difundir({ tipo: 'tx-fim', id: id });
    if (p) difundir({ tipo: 'msg', sistema: true, texto: p.nome + ' parou de transmitir' });
    atualizarControladorMusica();
  }

  function hubForcarParar(id) {
    if (!transmissoesHub.has(id)) return;
    enviarPara(id, { tipo: 'tx-forcar-parar' });
    pararTxHub(id);
  }

  // quem controla a música: quem está transmitindo há mais tempo
  function atualizarControladorMusica() {
    let melhor = null, desde = Infinity;
    transmissoesHub.forEach((t, id) => { if (t.desde < desde) { desde = t.desde; melhor = id; } });
    if (melhor === null) melhor = eu.id; // ninguém transmitindo: o dono controla a música
    if (melhor !== controladorMusica) {
      controladorMusica = melhor;
      difundir({ tipo: 'musica-dono', id: melhor });
    }
  }

  function hubReceber(id, d) {
    const p = participantes.get(id);
    if (!p || !d) return;
    p.ultimo = Date.now();

    if (d.tipo === 'status') {
      p.visivel = !!d.visivel;
    } else if (d.tipo === 'chat') {
      // o nome vem do que o dono já registrou (ninguém consegue se passar por outra pessoa)
      const agora = Date.now();
      if (agora - p.ultimaMsg < 400) return; // anti-flood
      p.ultimaMsg = agora;
      const m = { tipo: 'msg', nome: p.nome };
      if (typeof d.texto === 'string' && d.texto.trim()) m.texto = d.texto.trim().slice(0, 200);
      else if (imgValida(d.img)) m.img = d.img;
      else return;
      difundir(m);
    } else if (d.tipo === 'tx-quero') {
      if (transmissoesHub.has(id)) return;
      if (transmissoesHub.size >= MAX_TRANSMISSOES) {
        enviarPara(id, { tipo: 'tx-negado', motivo: 'Já tem ' + MAX_TRANSMISSOES + ' transmissões ao mesmo tempo.' });
        return;
      }
      transmissoesHub.set(id, { nome: p.nome, mudo: false, desde: Date.now() });
      difundir({ tipo: 'tx-inicio', id: id, nome: p.nome });
      enviarPara(id, { tipo: 'tx-ok', alvos: [...participantes.keys()].filter(x => x !== id) });
      difundir({ tipo: 'msg', sistema: true, texto: p.nome + ' começou a transmitir' });
      atualizarControladorMusica();
    } else if (d.tipo === 'tx-parar') {
      pararTxHub(id);
    } else if (d.tipo === 'tx-mudo') {
      const t = transmissoesHub.get(id);
      if (t) { t.mudo = !!d.mudo; difundir({ tipo: 'tx-mudo', id: id, mudo: t.mudo }, id); }
    } else if (d.tipo === 'yt') {
      if (id !== controladorMusica) return; // só quem controla a música pode mexer nela
      const e = {
        tipo: 'yt',
        id: (typeof d.id === 'string' && REGEX_YT_ID.test(d.id)) ? d.id : null,
        t: Math.max(0, Math.min(Number(d.t) || 0, 100000)),
        tocando: !!d.tocando
      };
      musicaEstado = e;
      difundir(e, id);
    }
  }

  // a cada 3s: atualiza quem está com aba em segundo plano ou sem sinal
  function hubTick() {
    const e = {};
    participantes.forEach((p, id) => {
      if (id === eu.id) { p.visivel = !document.hidden; p.ultimo = Date.now(); }
      e[id] = (Date.now() - p.ultimo > TEMPO_SEM_SINAL) ? 2 : (p.visivel ? 0 : 1);
    });
    difundir({ tipo: 'estados', e: e });
  }

  // alguém tentou entrar: só entra depois de mandar o "oi" (com a senha certa, se a sala tiver)
  peer.on('connection', c => {
    if (!souDono) { c.close(); return; }
    let autenticado = false;
    const prazo = setTimeout(() => { if (!autenticado) c.close(); }, 10000); // quem não se identifica em 10s é desconectado

    c.on('data', d => {
      if (!d || encerrado) return;
      if (!autenticado) {
        if (d.tipo !== 'oi') return; // antes de entrar, só o "oi" é aceito
        if (op.senha && d.senha !== op.senha) {
          // senha errada: espera 1s (atrapalha quem tenta adivinhar) e desconecta
          setTimeout(() => {
            try { c.send({ tipo: 'senhaErrada' }); } catch (e) {}
            setTimeout(() => c.close(), 300);
          }, 1000);
          return;
        }
        if (participantes.size >= MAX_PESSOAS) {
          c.send({ tipo: 'cheio' });
          setTimeout(() => c.close(), 500);
          return;
        }
        autenticado = true;
        clearTimeout(prazo);
        hubEntrar(c, d);
        return;
      }
      hubReceber(c.peer, d);
    });

    c.on('close', () => { clearTimeout(prazo); hubSair(c.peer); });
  });

  // ---------- começar ----------
  peer.on('open', id => {
    eu.id = id;
    if (souDono) {
      participantes.set(id, { conn: null, nome: eu.nome, foto: eu.foto, visivel: true, ultimo: Date.now(), ultimaMsg: 0 });
      controladorMusica = id; // no começo, o dono controla a música
      hubTimer = setInterval(hubTick, 3000);
      // o dono "entra" na própria sala sem passar pela rede
      aoReceberDoHub({
        tipo: 'entrada', voce: id,
        dono: { id: id, nome: eu.nome, foto: eu.foto },
        discord: op.discordLink || '',
        participantes: listaPessoas(), transmissoes: [], controlador: controladorMusica, musica: null
      });
      return;
    }

    conn = peer.connect(op.hostId);
    // se a conexão não completar, em vez de ficar eternamente em "Conectando...", explica o que conferir
    prazoEntrada = setTimeout(() => {
      if (entrou) return;
      sair('Não consegui entrar na sala (demorou demais).' +
        '<br><small>Confira: o dono está com a página aberta? O link tem o # com o código no final? ' +
        'Os dois deram Ctrl+F5 pra pegar a versão nova do site? ' +
        'Redes de escola/trabalho e dados móveis às vezes bloqueiam a conexão: tente outro Wi-Fi.</small>');
    }, TEMPO_ENTRADA);
    conn.on('open', () => {
      conn.send({ tipo: 'oi', nome: eu.nome, foto: eu.foto, senha: op.senha || '' });
      function enviarStatus() {
        if (encerrado || !conn.open) return;
        conn.send({ tipo: 'status', visivel: !document.hidden });
      }
      statusTimer = setInterval(enviarStatus, INTERVALO_STATUS);
      document.addEventListener('visibilitychange', enviarStatus);
    });
    conn.on('data', d => {
      if (!d) return;
      if (d.tipo === 'cheio') sair('A sala está cheia.');
      else if (d.tipo === 'senhaErrada') {
        try { sessionStorage.removeItem('syt-senha'); } catch (e) {}
        sair('Senha incorreta.');
      }
      else if (d.tipo === 'host') { // mensagem do site antigo (antes das salas)
        sair('O dono está com uma versão antiga do site. Peça pra ele atualizar a página (Ctrl+F5) e mandar o link novo.');
      }
      else aoReceberDoHub(d);
    });
    // se o dono fechar a sala ou cair, avisa
    conn.on('close', () => sair('A sala foi encerrada.'));
  });

  peer.on('error', err => {
    if (encerrado || !err) return;
    if (err.type === 'peer-unavailable') sair('Sala não encontrada. Peça um link novo pro dono.');
    else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') sair('Erro de conexão. Tente de novo.');
  });
}

// ===== ENTRADA: criar sala ou entrar numa sala =====
function modoDono() {
  setVazio('AGUARDANDO...');
  const confirmar = formPerfil('syt-perfil', 'Criar sala', 'go',
    'Você cria a sala e qualquer pessoa nela pode transmitir a tela. Com senha, só entra quem souber.',
    'Senha da sala (opcional)', 'Link da call do Discord (opcional)');
  $('discord').value = lerSalvo('syt-discord', { link: '' }).link || '';

  $('go').onclick = () => {
    const perfil = confirmar('Anônimo');
    const senha = ($('senha').value || '').slice(0, 30); // fica só na memória, não é salva
    const discordLink = ($('discord').value || '').trim();
    if (discordLink && !discordValido(discordLink)) {
      alert('Link do Discord inválido. Use um convite (discord.gg/... ou discord.com/invite/...) ou o link do canal de voz.');
      return;
    }
    gravarSalvo('syt-discord', { link: discordLink });
    ui.textContent = 'Criando sala...';
    iniciarSala({ souDono: true, perfil: perfil, senha: senha, discordLink: discordLink });
  };
}

function modoParticipante() {
  setVazio('ENTRE NA SALA');
  const confirmar = formPerfil('syt-perfil', 'Entrar na sala', 'join',
    'Todo mundo na sala vê seu nome, sua foto e se você está com a aba aberta.',
    'Senha da sala (se tiver)');
  try { // se você já digitou a senha nesta aba, ela volta preenchida
    const sv = sessionStorage.getItem('syt-senha');
    if (sv) $('senha').value = sv;
  } catch (e) {}

  $('join').onclick = () => {
    const perfil = confirmar('Alguém');
    const senha = ($('senha').value || '').slice(0, 30);
    try { sessionStorage.setItem('syt-senha', senha); } catch (e) {}
    ui.textContent = 'Conectando...';
    setVazio('CONECTANDO...');
    iniciarSala({ souDono: false, hostId: hostId, perfil: perfil, senha: senha });
  };
}

if (hostId) modoParticipante(); else modoDono();
</script>
